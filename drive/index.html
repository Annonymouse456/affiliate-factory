<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="3;url=../car/">
<title>จอขับขี่ย้ายที่อยู่แล้ว</title>
<style>body{margin:0;height:100vh;background:#0c1114;color:#f1f5f6;font:20px/1.5 sans-serif;text-align:center}a{color:#3a93ff}p{padding:20vh 16px 0}</style>
</head>
<body>
<p>จอขับขี่ย้ายไปที่ <a href="../car/">/car/</a> แล้ว กำลังพาไป…</p>
<script>
// Remove the old offline copy that kept showing an outdated page, then move to the new address.
(function () {
  function go() { location.replace('../car/'); }
  try {
    var jobs = [];
    if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.filter(function (r) { return r.scope.indexOf('/drive/') !== -1; }).map(function (r) { return r.unregister(); })); }));
    if (window.caches) jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.filter(function (k) { return k.indexOf('drive-') === 0; }).map(function (k) { return caches.delete(k); })); }));
    Promise.all(jobs).then(go, go);
  } catch (e) { go(); }
})();
</script>
</body>
</html>
