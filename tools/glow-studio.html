<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0e0f13">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Glow Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
html{-webkit-text-size-adjust:100%}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: one-screen mobile editor — top bar, photo stage, tool panel, bottom tab bar. Committed dark studio look. */
:root{
  --bg:#0e0f13; --surface:#161922; --surface2:#1e222d; --line:#2a2f3c;
  --fg:#f2f4f8; --muted:#9aa3b2; --accent:#ff5c8a; --accent2:#7c6cff; --good:#38d39f;
  --r:14px; --tab-h:64px;
  color-scheme:dark;
  --fontUI:'Inter',system-ui,-apple-system,'Noto Sans Thai',sans-serif;
  --fontBrand:'Space Grotesk',var(--fontUI);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--fontUI);overflow:hidden;-webkit-tap-highlight-color:transparent}
#app{display:flex;flex-direction:column;height:100%;max-width:640px;margin:0 auto;background:var(--bg)}

/* top bar */
#topbar{display:flex;align-items:center;gap:8px;padding:10px max(12px,env(safe-area-inset-left,0px)) 10px max(12px,env(safe-area-inset-right,0px));
  padding-top:calc(10px + env(safe-area-inset-top,0px));background:var(--surface);border-bottom:1px solid var(--line);flex:0 0 auto}
.brand{font-family:var(--fontBrand);font-weight:700;font-size:1.02rem;letter-spacing:.2px;margin:0 auto 0 4px;white-space:nowrap}
@media (max-width:430px){.brand{font-size:.9rem}}
.brand span{color:var(--accent)}
#topbar button{font-family:var(--fontUI)}
.iconbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);color:var(--fg);font-size:1.1rem;cursor:pointer;display:grid;place-items:center}
.iconbtn:disabled{opacity:.35;cursor:default}
.tbtn{height:38px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);color:var(--fg);font-weight:600;font-size:.85rem;cursor:pointer;white-space:nowrap}
.tbtn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;color:#fff}

/* stage */
#stage{flex:1 1 auto;min-height:0;display:grid;place-items:center;padding:14px;position:relative;background:
  radial-gradient(120% 90% at 50% 0%,#1a1d27 0%,var(--bg) 70%)}
#canvasWrap{position:relative;max-width:100%;max-height:100%;line-height:0;box-shadow:0 18px 50px rgba(0,0,0,.5);background:#000;transition:padding .15s,background .15s,border-radius .15s}
#base,#doodle{display:block;max-width:100%;max-height:100%;touch-action:none;border-radius:inherit}
#doodle{position:absolute;inset:0;width:100%;height:100%}
#overlay{position:absolute;inset:0}
.ov{position:absolute;left:0;top:0;transform-origin:center center;cursor:grab;user-select:none;white-space:nowrap;will-change:transform;line-height:1}
.ov.sel{outline:1.5px dashed var(--accent);outline-offset:4px}
.ov .handle{position:absolute;width:26px;height:26px;border-radius:50%;background:var(--accent);right:-13px;bottom:-13px;display:none;place-items:center;color:#fff;font-size:13px;cursor:nwse-resize;border:2px solid #fff;touch-action:none}
.ov .del{position:absolute;width:26px;height:26px;border-radius:50%;background:#e23;left:-13px;top:-13px;display:none;place-items:center;color:#fff;font-size:14px;cursor:pointer;border:2px solid #fff}
.ov.sel .handle,.ov.sel .del{display:grid}
#emptyHint{position:absolute;inset:auto 0 12px 0;text-align:center;color:var(--muted);font-size:.78rem;pointer-events:none}
#btnFull,#btnCmp{position:absolute;top:10px;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:rgba(22,25,34,.72);color:var(--fg);font-size:1.05rem;cursor:pointer;z-index:6;display:grid;place-items:center;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
#btnFull{right:10px}
#btnCmp{right:10px;top:auto;bottom:10px;touch-action:none;user-select:none;-webkit-user-select:none}
#btnCmp svg{width:20px;height:20px;display:block;pointer-events:none}
#btnCmp.on{background:var(--accent);border-color:var(--accent);color:#fff}
#cmpImg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;z-index:5;pointer-events:none;border-radius:inherit}
#cmpLabel{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.6);color:#fff;font-size:.72rem;padding:4px 12px;border-radius:999px;z-index:6;pointer-events:none}

/* crop box */
#cropBox{position:absolute;border:1px solid rgba(255,255,255,.9);box-shadow:0 0 0 4000px rgba(0,0,0,.45);touch-action:none;cursor:move}
#cropBox .ch{position:absolute;width:24px;height:24px;touch-action:none}
#cropBox .ch::before{content:"";position:absolute;width:16px;height:16px;border:2px solid #fff}
#cropBox .nw{left:-2px;top:-2px;cursor:nwse-resize}.nw::before{border-right:none;border-bottom:none;left:0;top:0}
#cropBox .ne{right:-2px;top:-2px;cursor:nesw-resize}.ne::before{border-left:none;border-bottom:none;right:0;top:0}
#cropBox .sw{left:-2px;bottom:-2px;cursor:nesw-resize}.sw::before{border-right:none;border-top:none;left:0;bottom:0}
#cropBox .se{right:-2px;bottom:-2px;cursor:nwse-resize}.se::before{border-left:none;border-top:none;right:0;bottom:0}
.crop-grid{position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.25) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.25) 1px,transparent 1px);background-size:33.33% 33.33%}

/* panel */
#panel{flex:0 0 auto;background:var(--surface);border-top:1px solid var(--line);max-height:40vh;overflow-y:auto;
  padding:12px max(12px,env(safe-area-inset-left,0px)) 12px max(12px,env(safe-area-inset-right,0px))}
#panel:empty{display:none}
.panelHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.panelHead h2{font-size:.9rem;margin:0;font-weight:700}
.linkbtn{background:none;border:none;color:var(--accent);font-weight:600;font-size:.82rem;cursor:pointer}
/* sliders */
.row{display:flex;align-items:center;gap:10px;margin:10px 0}
.row label{flex:0 0 96px;font-size:.8rem;color:var(--muted)}
.row output{flex:0 0 40px;text-align:right;font-size:.78rem;font-variant-numeric:tabular-nums;color:var(--fg)}
input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:4px;border-radius:4px;background:var(--surface2);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--accent);border:3px solid #fff2;cursor:pointer}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--accent);border:3px solid #fff2;cursor:pointer}
/* filter strip */
.strip{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.thumb{flex:0 0 auto;width:66px;text-align:center;cursor:pointer}
.thumb canvas{width:64px;height:64px;border-radius:12px;border:2px solid transparent;object-fit:cover;background:#000}
.thumb.active canvas{border-color:var(--accent)}
.thumb span{display:block;font-size:.68rem;color:var(--muted);margin-top:4px}
.thumb.active span{color:var(--fg)}
/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface2);color:var(--fg);font-size:.8rem;cursor:pointer}
.chip.active{background:var(--accent);border-color:var(--accent);color:#fff}
.adjchip{flex:0 0 auto;background:none;border:none;color:var(--muted);font-size:.76rem;padding:6px 10px;cursor:pointer;white-space:nowrap;font-family:var(--fontUI)}
.adjchip.active{color:var(--accent);font-weight:600}
.adjchip .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:transparent;margin-right:4px;vertical-align:middle}
.adjchip .dot.on{background:var(--accent)}
.grid-emoji{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px}
.grid-emoji button{font-size:1.5rem;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:6px 0;cursor:pointer;line-height:1}
.ta{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:10px;color:var(--fg);padding:10px;font-size:.95rem;font-family:var(--fontUI);resize:none}
.swatches{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.sw{width:28px;height:28px;border-radius:50%;border:2px solid #fff3;cursor:pointer}
.sw.active{outline:2px solid var(--accent);outline-offset:2px}
.fontpick{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.note{font-size:.72rem;color:var(--muted);margin:6px 0 0}

/* tab bar */
#tabbar{flex:0 0 auto;display:flex;gap:2px;background:var(--surface);border-top:1px solid var(--line);
  padding:8px max(6px,env(safe-area-inset-left,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-right,0px));
  overflow-x:auto;height:calc(var(--tab-h) + env(safe-area-inset-bottom,0px));flex:0 0 auto}
.tab{flex:1 0 auto;min-width:58px;background:none;border:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 6px;border-radius:10px;cursor:pointer;font-size:.66rem;font-family:var(--fontUI)}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
.tab.active{color:var(--accent)}

/* ai busy + toast */
#aiBusy{position:fixed;inset:0;background:rgba(0,0,0,.62);display:grid;place-items:center;z-index:60;color:#fff;text-align:center}
#aiBusy .sp{width:46px;height:46px;border:4px solid rgba(255,255,255,.2);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
#aiToast{position:fixed;left:50%;bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px) + 16px);transform:translateX(-50%);background:var(--surface2);border:1px solid var(--line);color:var(--fg);padding:10px 16px;border-radius:999px;z-index:70;font-size:.82rem;max-width:88%;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.aiInput{flex:1;background:var(--surface2);border:1px solid var(--line);border-radius:8px;color:var(--fg);padding:9px;font-size:.82rem;font-family:var(--fontUI);min-width:0}
/* save modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:grid;place-items:center;z-index:50;padding:16px}
.modal .card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;max-width:420px;width:100%;max-height:88vh;overflow:auto}
.modal h3{margin:0 0 4px;font-size:1rem}
.modal .saveimg{width:100%;border-radius:12px;margin:10px 0;display:block;background:#000}
.modal .note{margin-bottom:10px}
.modal .actions{display:flex;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:6px}
.seg button{background:var(--surface2);border:none;color:var(--muted);padding:7px 14px;font-size:.8rem;cursor:pointer;font-family:var(--fontUI)}
.seg button.active{background:var(--accent);color:#fff}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&family=Noto+Sans+Thai:wght@400;600&family=Pacifico&family=Prompt:wght@600&display=swap">
</head>
<body>

<div id="app">
  <header id="topbar">
    <button class="iconbtn" id="btnUndo" title="ย้อนกลับ" disabled>&#8630;</button>
    <button class="iconbtn" id="btnRedo" title="ทำซ้ำ" disabled>&#8631;</button>
    <div class="brand">Glow <span>Studio</span></div>
    <button class="iconbtn" id="btnAuto" title="ปรับออโต้ (Auto)">✨</button>
    <button class="iconbtn" id="btnCam" title="กล้องบิวตี้">📷</button>
    <button class="tbtn" id="btnImport">รูป</button>
    <button class="tbtn primary" id="btnSave">บันทึก</button>
  </header>

  <main id="stage">
    <div id="canvasWrap">
      <canvas id="base"></canvas>
      <canvas id="doodle"></canvas>
      <div id="overlay"></div>
      <div id="cropBox" hidden>
        <div class="crop-grid"></div>
        <div class="ch nw" data-c="nw"></div><div class="ch ne" data-c="ne"></div>
        <div class="ch sw" data-c="sw"></div><div class="ch se" data-c="se"></div>
      </div>
      <img id="cmpImg" hidden alt="">
      <div id="cmpLabel" hidden>ต้นฉบับ (ก่อนแต่ง)</div>
    </div>
    <div id="emptyHint">แตะ “รูป” เพื่อเลือกภาพของคุณ · ตอนนี้เป็นภาพตัวอย่าง</div>
    <button id="btnFull" title="เต็มจอ">⤢</button>
    <button id="btnCmp" title="กดค้างดูต้นฉบับ (ก่อน/หลัง)"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M6 18L18 6V18Z" fill="currentColor"/></svg></button>
  </main>

  <section id="panel"></section>

  <nav id="tabbar"></nav>
</div>

<input id="file" type="file" accept="image/*" hidden>
<div id="saveModal" class="modal" hidden></div>
<div id="aiBusy" hidden><div><div class="sp"></div><span id="aiBusyMsg">กำลังประมวลผล…</span></div></div>

<script>
"use strict";
/* ---------- state ---------- */
const S = {
  adjust:{brightness:1,contrast:1,saturation:1,temp:0,clarity:0,vignette:0,fade:0,exposure:1},
  beauty:{smooth:0,whiten:0,rosy:0},
  filter:"org",
  filterStrength:1,
  filterCat:"all",
  fx:{grain:0,leak:0,dust:0},
  frame:"none",
  overlays:[],         // {id,type,content,font,color,size,x,y,scale,rot,el}
  baseSrc:null,        // data URL of current (baked) base image
  originalSrc:null,    // data URL of the originally imported image (for before/after)
  natW:0,natH:0,       // natural dims of base image
  tab:"filter",
  doodle:{color:"#ff5c8a",size:8,erase:false}
};
const PRESETS = {
  org:{n:"ต้นฉบับ",f:""},
  fresh:{n:"ใส",f:"brightness(1.06) saturate(1.12)",ov:{c:"#9fd8ff",a:.08,m:"soft-light"}},
  warm:{n:"วอร์ม",f:"saturate(1.12) sepia(.12)",ov:{c:"#ff9b4d",a:.16,m:"soft-light"}},
  sweet:{n:"หวาน",f:"brightness(1.05) saturate(1.1)",ov:{c:"#ff6fae",a:.14,m:"soft-light"}},
  film:{n:"ฟิล์ม",f:"contrast(1.08) saturate(.9) sepia(.22)",vig:.18},
  vivid:{n:"สด",f:"saturate(1.45) contrast(1.12)"},
  cool:{n:"คูล",f:"saturate(1.05) hue-rotate(-8deg)",ov:{c:"#4d7bff",a:.14,m:"soft-light"}},
  vintage:{n:"วินเทจ",f:"sepia(.4) contrast(.95) brightness(1.05) saturate(.95)",vig:.12},
  fade:{n:"ฟุ้ง",f:"contrast(.9) brightness(1.08) saturate(.82)",fade:.25},
  mono:{n:"ขาวดำ",f:"grayscale(1) contrast(1.06)"},
  noir:{n:"นัวร์",f:"grayscale(1) contrast(1.35) brightness(.95)",vig:.25},
  sunset:{n:"พระอาทิตย์",f:"saturate(1.2) contrast(1.05)",ov:{c:"#ff7a3d",a:.22,m:"soft-light"}},
  kodak:{n:"ฟิล์มทอง",f:"saturate(1.18) contrast(1.05) brightness(1.03) sepia(.18)",ov:{c:"#ffb14d",a:.12,m:"soft-light"}},
  fuji:{n:"ฟิล์มเขียว",f:"saturate(.98) contrast(1.06) hue-rotate(6deg)",ov:{c:"#2f7a52",a:.12,m:"soft-light"}},
  ocean:{n:"ฟิล์มฟ้า",f:"saturate(1.06) contrast(1.04) hue-rotate(-10deg)",ov:{c:"#2aa0b8",a:.13,m:"soft-light"}},
  faded:{n:"ฟิล์มจาง",f:"contrast(.86) saturate(.82) brightness(1.06)",fade:.3},
  retro:{n:"ย้อนยุค",f:"sepia(.45) contrast(.96) saturate(.92) brightness(1.02)",ov:{c:"#8a5a2b",a:.1,m:"soft-light"},vig:.14},
  moody:{n:"มูดดี้",f:"contrast(1.16) saturate(.76) brightness(.96)",ov:{c:"#223040",a:.16,m:"soft-light"},vig:.2},
  cinema:{n:"ซีเนมา",f:"contrast(1.12) saturate(1.1) hue-rotate(-6deg)",ov:{c:"#ff7a3d",a:.1,m:"soft-light"},vig:.12},
  pastel:{n:"พาสเทล",f:"brightness(1.08) saturate(.9) contrast(.92)",ov:{c:"#ffd1e8",a:.15,m:"soft-light"}},
  airy:{n:"ขาวนวล",f:"brightness(1.1) contrast(.95) saturate(1.0)",ov:{c:"#ffffff",a:.1,m:"soft-light"},fade:.12},
  nineties:{n:"90s",f:"sepia(.2) saturate(1.12) contrast(1.05)",ov:{c:"#ff5c8a",a:.08,m:"soft-light"},fade:.15},
  monofilm:{n:"ขาวดำฟิล์ม",f:"grayscale(1) contrast(1.28) brightness(1.02)",vig:.14},
  autumn:{n:"ตะวันเย็น",f:"saturate(1.22) contrast(1.04) sepia(.28)",ov:{c:"#ff8a2b",a:.18,m:"soft-light"}},
  nordic:{n:"นอร์ดิก",f:"saturate(.72) contrast(1.05) brightness(1.02)",ov:{c:"#4d7bff",a:.08,m:"soft-light"}},
  neon:{n:"นีออน",f:"contrast(1.15) saturate(1.3) hue-rotate(-15deg)",ov:{c:"#7c3dff",a:.14,m:"soft-light"}}
};
const FILTER_CATS={
  bright:["fresh","sweet","vivid","cool","sunset","pastel","airy"],
  film:["film","kodak","fuji","ocean","cinema","autumn","nordic","neon","moody"],
  vintage:["warm","vintage","fade","faded","retro","nineties"],
  bw:["mono","noir","monofilm"]
};
function presetCat(key){ for(const c in FILTER_CATS){ if(FILTER_CATS[c].includes(key)) return c; } return "other"; }
const EMOJI_CATS = {
  "ยอดนิยม":["😍","🥰","😎","🤩","🔥","✨","💖","❤️","👑","🎀","🌸","📷","💄","⭐","💫","🙌","🫶","💅","🥳","😘"],
  "หน้า":["😍","😘","🥰","😎","🤩","😂","🥹","😇","😊","😅","😭","🥳","😏","😳","🤭","😴","🤗","😌","🥲","😤"],
  "รัก":["❤️","🧡","💛","💚","💙","💜","🖤","🤍","💖","💕","💘","💓","💗","💞","💝","😻","🫶","💋","💐","🌹"],
  "ธรรมชาติ":["🌸","🌷","🌺","🌻","🌹","🌈","☀️","🌙","⭐","🌟","⚡","❄️","🍃","🌿","🌴","🌊","🔥","💧","🍂","☁️"],
  "ปาร์ตี้":["🎉","🎈","🎀","🎁","🎂","🍰","🥂","🍾","🎊","✨","💫","🪩","🎇","🎆","🧁","🍭"],
  "สัตว์":["🐱","🐶","🐰","🐻","🐼","🦊","🦋","🐥","🐸","🦄","🐧","🐨","🐯","🐮","🐷","🐣"],
  "อื่น ๆ":["💎","👛","☕","🍓","🍑","🍒","🍩","🍭","📱","💌","🔮","🏆","💰","🛍️","🎧","🕶️","✈️","📍"]
};
let stickCat=Object.keys(EMOJI_CATS)[0];
const SWATCHES = ["#ffffff","#111111","#ff5c8a","#7c6cff","#38d39f","#ffd23f","#ff7a3d","#4d7bff","#ff3b6b","#00d2d2"];
const FONTS = [["Prompt","Prompt"],["Noto Sans Thai","Noto Sans Thai"],["Pacifico","Pacifico"],["Space Grotesk","Space Grotesk"],["Inter","Inter"]];

/* ---------- refs ---------- */
const $ = s=>document.querySelector(s);
const base=$("#base"), bctx=base.getContext("2d");
const dood=$("#doodle"), dctx=dood.getContext("2d");
const wrap=$("#canvasWrap"), overlay=$("#overlay"), stage=$("#stage");
const panel=$("#panel"), tabbar=$("#tabbar"), emptyHint=$("#emptyHint");
const img = new Image();

/* ---------- history ---------- */
let hist=[], hpos=-1;
function snapshot(){
  const st={adjust:{...S.adjust},beauty:{...S.beauty},filter:S.filter,filterStrength:S.filterStrength,fx:{...S.fx},frame:S.frame,
    baseSrc:S.baseSrc,natW:S.natW,natH:S.natH,

const cropBox=$("#cropBox");
let cropState=null, cropRatio=0; // 0 = free
function panelCrop(){
  head("ครอป & หมุน");
  const chips=document.createElement("div");chips.className="chips";
  [["free","อิสระ",0],["1:1","1:1",1],["4:5","4:5",4/5],["3:4","3:4",3/4],["16:9","16:9",16/9],["9:16","9:16",9/16]].forEach(([k,l,r])=>{

  );

  const apply=document.createElement("button");apply.className="chip";apply.style.background="var(--good)";apply.style.borderColor="var(--good)";apply.style.color="#06281f";apply.textContent="✓ ใช้การครอป";
  apply.onclick=applyCrop; act.appendChild(apply);

  panel.appendChild(act);

  startCrop();

function startCrop(){
  const bw=base.clientWidth,bh=base.clientHeight;
  let w=bw*0.8,h=bh*0.8;
  if(cropRatio){ if(w/h>cropRatio)w=h*cropRatio; else h=w/cropRatio; }
  cropState={x:(bw-w)/2,y:(bh-h)/2,w,h};
  cropBox.hidden=false; drawCrop();
}
function drawCrop(){
  if(!cropState)return;
  const r=base.getBoundingClientRect(),wr=wrap.getBoundingClientRect();
  const offx=r.left-wr.left, offy=r.top-wr.top;
  cropBox.style.left=(offx+cropState.x)+"px"; cropBox.style.top=(offy+cropState.y)+"px";
  cropBox.style.width=cropState.w+"px"; cropBox.style.height=cropState.h+"px";
}
cropBox.addEventListener("pointerdown",e=>{
  if(e.target.classList.contains("ch"))return;
  cropBox.setPointerCapture(e.pointerId);const sx=e.clientX,sy=e.clientY,ox=cropState.x,oy=cropState.y;const bw=base.clientWidth,bh=base.clientHeight;
  const mv=ev=>{cropState.x=Math.min(bw-cropState.w,Math.max(0,ox+ev.clientX-sx));cropState.y=Math.min(bh-cropState.h,Math.max(0,oy+ev.clientY-sy));drawCrop();};
  const up=()=>{cropBox.removeEventListener("pointermove",mv);cropBox.removeEventListener("pointerup",up);};
  cropBox.addEventListener("pointermove",mv);cropBox.addEventListener("pointerup",up);
});
cropBox.querySelectorAll(".ch").forEach(h=>{
  h.addEventListener("pointerdown",e=>{e.stopPropagation();h.setPointerCapture(e.pointerId);
    const c=h.dataset.c,sx=e.clientX,sy=e.clientY,o={...cropState},bw=base.clientWidth,bh=base.clientHeight;
    const mv=ev=>{let dx=ev.clientX-sx,dy=ev.clientY-sy;let x=o.x,y=o.y,w=o.w,hh=o.h;
      if(c.includes("w")){x=o.x+dx;w=o.w-dx;} if(c.includes("e")){w=o.w+dx;}
      if(c.includes("n")){y=o.y+dy;hh=o.h-dy;} if(c.includes("s")){hh=o.h+dy;}
      if(cropRatio){ if(c==="se"||c==="nw"){hh=w/cropRatio;} else {hh=w/cropRatio;} if(c.includes("n"))y=o.y+o.h-hh; }
      w=Math.max(40,w);hh=Math.max(40,hh);x=Math.max(0,Math.min(x,bw-w));y=Math.max(0,Math.min(y,bh-hh));
      if(x+w>bw)w=bw-x; if(y+hh>bh)hh=bh-y;
      cropState={x,y,w,h:hh};drawCrop();};
    const up=()=>{h.removeEventListener("pointermove",mv);h.removeEventListener("pointerup",up);};
    h.addEventListener("pointermove",mv);h.addEventListener("pointerup",up);});
});
function cancelCrop(){ cropBox.hidden=true; cropState=null; }
async function applyCrop(){
  if(!cropState)return;
  const sc=S.natW/base.clientWidth;
  const sx=cropState.x*sc, sy=cropState.y*sc, sw=cropState.w*sc, sh=cropState.h*sc;
  const c=document.createElement("canvas");c.width=Math.round(sw);c.height=Math.round(sh);
  c.getContext("2d").drawImage(img,sx,sy,sw,sh,0,0,c.width,c.height);
  await rebake(c);
  cancelCrop();
}
async function bake(kind){
  const c=document.createElement("canvas");const cx=c.getContext("2d");
  if(kind==="rot"){ c.width=S.natH;c.height=S.natW; cx.translate(c.width/2,c.height/2);cx.rotate(Math.PI/2);cx.drawImage(img,-S.natW/2,-S.natH/2);}
  else { c.width=S.natW;c.height=S.natH; cx.translate(kind==="flipH"?c.width:0,kind==="flipV"?c.height:0);cx.scale(kind==="flipH"?-1:1,kind==="flipV"?-1:1);cx.drawImage(img,0,0);}
  await rebake(c);
  if(S.tab==="crop")startCrop();
}
async function rebake(canvas){
  // bake current base image only (adjust/filter/beauty stay live on top); clear doodle to avoid misalignment on rotate/crop
  const prevDood = dood.toDataURL();
  S.baseSrc=canvas.toDataURL("image/png");
  await loadImg(S.baseSrc);
  fitStage();
  dctx.clearRect(0,0,dood.width,dood.height); // reset doodle after geometry change
  applyFrameCSS(); render(); repositionAll(); snapshot();
}

/* ---------- save / export ---------- */
function exportCanvas(type,quality){
  const fr=FRAMES[S.frame]||{}; const W=S.natW,H=S.natH; const b2=Math.min(W,H);
  const pad=(fr.p||0)*b2, padB=(fr.pb? fr.pb*b2 : pad);
  const cw=Math.round(W+pad*2), ch=Math.round(H+pad+padB);
  const c=document.createElement("canvas");c.width=cw;c.height=ch;const cx=c.getContext("2d");
  if(fr.bg){cx.fillStyle=fr.bg;cx.fillRect(0,0,cw,ch);}
  const px=pad,py=pad;
  cx.save(); cx.translate(px,py);
  if(fr.radius){const rad=fr.radius*b2;roundRect(cx,0,0,W,H,rad);cx.clip();}
  paintFull(cx,W,H);
  // doodle
  cx.drawImage(dood,0,0,W,H);
  cx.restore();
  // overlays
  const sc=W/base.clientWidth;
  S.overlays.forEach(o=>{
    cx.save(); cx.translate(px+o.x*W, py+o.y*H); cx.rotate(o.rot*Math.PI/180); cx.scale(o.scale*sc,o.scale*sc);
    cx.globalAlpha=o.opacity==null?1:o.opacity;
    if(o.type==="image"&&o.imgEl){const iw=o.size,ih=o.size*(o.imgEl.naturalHeight/o.imgEl.naturalWidth||1);cx.drawImage(o.imgEl,-iw/2,-ih/2,iw,ih);}
    else if(o.type==="text"){cx.fillStyle=o.color;cx.font=`600 ${o.size}px '${o.font}',sans-serif`;cx.textAlign="center";cx.textBaseline="middle";
      cx.shadowColor="rgba(0,0,0,.35)";cx.shadowBlur=10;cx.shadowOffsetY=2;
      o.content.split("\n").forEach((ln,i,arr)=>cx.fillText(ln,0,(i-(arr.length-1)/2)*o.size*1.15));}
    else {cx.font=`${o.size}px sans-serif`;cx.textAlign="center";cx.textBaseline="middle";cx.fillText(o.content,0,0);}
    cx.restore();
  });
  // film sprockets
  if(fr.sprocket){cx.fillStyle="#000";const n=Math.floor(cw/ (b2*0.07)); const s=b2*0.035;
    for(let i=0;i<n;i++){const x=i*(cw/n)+ (cw/n-s)/2; cx.fillStyle="rgba(255,255,255,.85)";cx.fillRect(x,pad*0.28,s,s*0.6);cx.fillRect(x,ch-pad*0.28-s*0.6,s,s*0.6);}}
  return c.toDataURL(type,quality);
}
function paintFull(ctx,W,H){ // same as paint but blurScale tuned for full res
  paint(ctx,W,H, Math.max(2,W/320*2)); }
function roundRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

let retouchMode=false, rwork=null, rblur=null, rmosaic=null, rdown=false, rlast=null;
const retouch={tool:"liquify",size:0.12,strength:0.5,blur:0.025,block:0.03};
const minDim=()=>Math.min(S.natW,S.natH);
function enterRetouch(){
  rwork=document.createElement("canvas");rwork.width=S.natW;rwork.height=S.natH;
  rwork.getContext("2d").drawImage(img,0,0);
  buildRLayers(); retouchMode=true; render();
}
function exitRetouch(){ retouchMode=false; rwork=rblur=rmosaic=null; }
function buildRLayers(){
  if(!rwork)return;
  rblur=document.createElement("canvas");rblur.width=S.natW;rblur.height=S.natH;
  const bc=rblur.getContext("2d");bc.filter=`blur(${Math.max(1,minDim()*retouch.blur)}px)`;bc.drawImage(rwork,0,0);
  rmosaic=document.createElement("canvas");rmosaic.width=S.natW;rmosaic.height=S.natH;
  const mc=rmosaic.getContext("2d");const bs=Math.max(4,minDim()*retouch.block);
  const sw=Math.max(1,Math.round(S.natW/bs)),sh=Math.max(1,Math.round(S.natH/bs));
  const tmp=document.createElement("canvas");tmp.width=sw;tmp.height=sh;tmp.getContext("2d").drawImage(rwork,0,0,sw,sh);
  mc.imageSmoothingEnabled=false;mc.drawImage(tmp,0,0,sw,sh,0,0,S.natW,S.natH);
}
function rXY(e){const r=dood.getBoundingClientRect();return {x:(e.clientX-r.left)/r.width*S.natW,y:(e.clientY-r.top)/r.height*S.natH};}
function retouchDown(e){ if(!retouchMode)return; rdown=true; dood.setPointerCapture(e.pointerId); rlast=rXY(e); applyTouch(rlast,rlast); render(); }
function retouchMove(e){ if(!retouchMode||!rdown)return; const p=rXY(e); applyTouch(rlast,p); rlast=p; render(); }
function retouchUp(){ if(rdown){rdown=false;} }
function applyTouch(a,b){
  const t=retouch.tool,r=minDim()*retouch.size;
  if(t==="liquify"){liquifyStep(a.x,a.y,b.x,b.y,r);return;}
  const dist=Math.hypot(b.x-a.x,b.y-a.y),steps=Math.max(1,Math.floor(dist/(r*0.35)));
  for(let i=0;i<=steps;i++){const x=a.x+(b.x-a.x)*i/steps,y=a.y+(b.y-a.y)*i/steps;
    if(t==="heal")revealLayer(rblur,x,y,r,false,0.7);
    else if(t==="blur")revealLayer(rblur,x,y,r,false,1);
    else if(t==="mosaic")revealLayer(rmosaic,x,y,r,true,1);}
}
function revealLayer(layer,px,py,r,hard,alpha){
  if(!layer)return; const rc=rwork.getContext("2d");const d=Math.ceil(2*r);
  const t=document.createElement("canvas");t.width=d;t.height=d;const tc=t.getContext("2d");
  tc.drawImage(layer,px-r,py-r,2*r,2*r,0,0,d,d);
  tc.globalCompositeOperation="destination-in";
  const g=tc.createRadialGradient(r,r,0,r,r,r);
  if(hard){g.addColorStop(0,`rgba(0,0,0,${alpha})`);g.addColorStop(.9,`rgba(0,0,0,${alpha})`);g.addColorStop(1,"rgba(0,0,0,0)");}
  else{g.addColorStop(0,`rgba(0,0,0,${alpha})`);g.addColorStop(.55,`rgba(0,0,0,${alpha*0.9})`);g.addColorStop(1,"rgba(0,0,0,0)");}
  tc.fillStyle=g;tc.fillRect(0,0,d,d);

}
function liquifyStep(ax,ay,bx,by,r){
  const rc=rwork.getContext("2d");const dx=bx-ax,dy=by-ay;
  const x0=Math.max(0,Math.floor(bx-r)),y0=Math.max(0,Math.floor(by-r));
  const x1=Math.min(S.natW,Math.ceil(bx+r)),y1=Math.min(S.natH,Math.ceil(by+r));
  const w=x1-x0,h=y1-y0; if(w<=0||h<=0)return;
  const src=rc.getImageData(x0,y0,w,h),sd=src.data;
  const out=rc.createImageData(w,h),od=out.data; od.set(sd);
  const str=retouch.strength*1.1;
  for(let yy=0;yy<h;yy++)for(let xx=0;xx<w;xx++){
    const px=x0+xx,py=y0+yy,dd=Math.hypot(px-bx,py-by); if(dd>r)continue;
    const f=1-dd/r,fo=f*f*str; let sx=(px-dx*fo)-x0,sy=(py-dy*fo)-y0;
    sx=Math.max(0,Math.min(w-1,sx));sy=Math.max(0,Math.min(h-1,sy));
    const xi=Math.floor(sx),yi=Math.floor(sy),fx=sx-xi,fy=sy-yi;
    const xi2=Math.min(w-1,xi+1),yi2=Math.min(h-1,yi+1);
    const i00=(yi*w+xi)*4,i10=(yi*w+xi2)*4,i01=(yi2*w+xi)*4,i11=(yi2*w+xi2)*4,o=(yy*w+xx)*4;
    for(let c=0;c<4;c++){const top=sd[i00+c]*(1-fx)+sd[i10+c]*fx,bot=sd[i01+c]*(1-fx)+sd[i11+c]*fx;od[o+c]=top*(1-fy)+bot*fy;}
  }
  rc.putImageData(out,x0,y0);
}

  render(); snapshot();
  enterRetouch(); refreshPanel();
}

function setLayoutCells(){const n=COL_LAYOUTS[col.layout].length;while(col.cells.length<n)col.cells.push({img:null,scale:1,ox:0,oy:0});if(col.sel>=n)col.sel=0;}

$("#btnAuto").onclick=autoEnhance;
async function autoEnhance(){

    const s=Math.min(1,480/Math.max(S.natW,S.natH));
    const sc=document.createElement("canvas");sc.width=Math.max(1,Math.round(S.natW*s));sc.height=Math.max(1,Math.round(S.natH*s));
    const scx=sc.getContext("2d");scx.drawImage(img,0,0,sc.width,sc.height);

    const hist=[new Uint32Array(256),new Uint32Array(256),new Uint32Array(256)];
    for(let i=0;i<d.length;i+=4){hist[0][d[i]]++;hist[1][d[i+1]]++;hist[2][d[i+2]]++;}

    for(let c=0;c<3;c++)for(let v=0;v<256;v++)lut[c][v]=(v-lo[c])*255/(hi[c]-lo[c]);

    ox.putImageData(im,0,0);
    // gentle saturation + warmth lift
    S.adjust.saturation=Math.min(2,S.adjust.saturation*1.08);

    mc.fillStyle="#000";mc.fillRect(0,0,W,H);mc.fillStyle="#fff";
    faces.forEach(f=>fillPoly(mc,lmPoly(f,FACE_OVAL,W,H)));
    mc.fillStyle="#000";faces.forEach(f=>[L_EYE,R_EYE,LIPS,L_BROW,R_BROW].forEach(idx=>fillPoly(mc,lmPoly(f,idx,W,H))));
    const maskF=document.createElement("canvas");maskF.width=W;maskF.height=H;const mf=maskF.getContext("2d");
    mf.filter=`blur(${Math.max(2,mn*0.012)}px)`;mf.drawImage(mask,0,0);
    const work=document.createElement("canvas");work.width=W;work.height=H;const wc=work.getContext("2d");
    wc.drawImage(img,0,0);
    const blur=document.createElement("canvas");blur.width=W;blur.height=H;const bc=blur.getContext("2d");
    bc.filter=`blur(${Math.max(2,mn*0.006*(1+strength))}px)`;bc.drawImage(img,0,0);
    bc.filter="none";bc.globalCompositeOperation="destination-in";bc.drawImage(maskF,0,0);
    wc.globalAlpha=strength*0.9;wc.drawImage(blur,0,0);wc.globalAlpha=1;
    const bright=document.createElement("canvas");bright.width=W;bright.height=H;const brc=bright.getContext("2d");
    brc.fillStyle="#fff";brc.fillRect(0,0,W,H);brc.globalCompositeOperation="destination-in";brc.drawImage(maskF,0,0);
    wc.globalCompositeOperation="soft-light";wc.globalAlpha=strength*0.28;wc.drawImage(bright,0,0);
    wc.globalCompositeOperation="source-over";wc.globalAlpha=1;
    await bakeCanvas(work);
    aiToast("บิวตี้อัตโนมัติเสร็จ ✓ ("+faces.length+" ใบหน้า)");
  }catch(e){ aiToast(e.message||String(e)); }
  finally{ aiBusy=false; aiOverlay(false); }
}
function warpPush(cv,bx,by,r,dx,dy,str){
  const ctx=cv.getContext("2d");
  const x0=Math.max(0,Math.floor(bx-r)),y0=Math.max(0,Math.floor(by-r));
  const x1=Math.min(cv.width,Math.ceil(bx+r)),y1=Math.min(cv.height,Math.ceil(by+r));
  const w=x1-x0,h=y1-y0; if(w<=0||h<=0)return;
  const src=ctx.getImageData(x0,y0,w,h),sd=src.data,out=ctx.createImageData(w,h),od=out.data;od.set(sd);
  for(let yy=0;yy<h;yy++)for(let xx=0;xx<w;xx++){
    const px=x0+xx,py=y0+yy,dd=Math.hypot(px-bx,py-by); if(dd>r)continue;
    const fo=(1-dd/r)*(1-dd/r)*str; let sx=(px-dx*fo)-x0,sy=(py-dy*fo)-y0;
    sx=Math.max(0,Math.min(w-1,sx));sy=Math.max(0,Math.min(h-1,sy));
    const xi=Math.floor(sx),yi=Math.floor(sy),fx=sx-xi,fy=sy-yi,xi2=Math.min(w-1,xi+1),yi2=Math.min(h-1,yi+1);
    const i00=(yi*w+xi)*4,i10=(yi*w+xi2)*4,i01=(yi2*w+xi)*4,i11=(yi2*w+xi2)*4,o=(yy*w+xx)*4;
    for(let c=0;c<4;c++){const top=sd[i00+c]*(1-fx)+sd[i10+c]*fx,bot=sd[i01+c]*(1-fx)+sd[i11+c]*fx;od[o+c]=top*(1-fy)+bot*fy;}
  }
  ctx.putImageData(out,x0,y0);
}
async function faceSlimAuto(amount){
  if(!S.baseSrc||aiBusy)return; aiBusy=true; aiOverlay(true,"กำลังโหลดโมเดล/ตรวจใบหน้า…");
  try{
    let faces; try{ faces=await detectFaces(); }catch(e){ throw new Error("โหลดโมเดลไม่ได้ — ต้องเปิดบนเว็บจริง (ลิงก์ Pages)"); }
    if(!faces.length) throw new Error("ไม่พบใบหน้าในรูปนี้");
    aiOverlay(true,"กำลังดัดหน้า…"); await new Promise(r=>setTimeout(r,20));
    const W=S.natW,H=S.natH;
    const work=document.createElement("canvas");work.width=W;work.height=H;work.getContext("2d").drawImage(img,0,0);
    const JAW=[234,93,132,58,172,136,150,149,176,148,152,377,400,378,379,365,397,288,361,323,454];
    faces.forEach(f=>{
      const cx=f[1].x*W, faceW=Math.abs((f[454].x-f[234].x)*W);
      JAW.forEach(i=>{ const px=f[i].x*W,py=f[i].y*H, dir=px<cx?1:-1, dx=dir*faceW*0.045*amount;
        warpPush(work,px,py,faceW*0.17,dx,0,0.85); });
    });
    await bakeCanvas(work);
    aiToast("ดัดหน้าเสร็จ ✓");
  }catch(e){ aiToast(e.message||String(e)); }
  finally{ aiBusy=false; aiOverlay(false); }
}

/* ---- face retouch extras (teeth / eyes / nose / lip / blush / acne) ---- */
const INNER_LIPS=[78,95,88,178,87,14,317,402,318,324,308,415,310,311,312,13,82,81,80,191];
const NOSE_SIDES=[48,64,278,294,98,327];
function _pt(f,i,W,H){ return {x:f[i].x*W,y:f[i].y*H}; }
function _center(f,idx,W,H){ let sx=0,sy=0; idx.forEach(i=>{sx+=f[i].x;sy+=f[i].y;}); return {x:sx/idx.length*W,y:sy/idx.length*H}; }
function _span(f,a,b,W){ return Math.abs((f[a].x-f[b].x)*W); }
function _mask(f,polys,W,H,feather){
  const m=document.createElement("canvas");m.width=W;m.height=H;const x=m.getContext("2d");x.fillStyle="#fff";
  polys.forEach(idx=>{x.beginPath();idx.forEach((i,k)=>{const px=f[i].x*W,py=f[i].y*H;k?x.lineTo(px,py):x.moveTo(px,py);});x.closePath();x.fill();});
  if(feather>0){const m2=document.createElement("canvas");m2.width=W;m2.height=H;const x2=m2.getContext("2d");x2.filter=`blur(${feather}px)`;x2.drawImage(m,0,0);return m2;}
  return m;
}
async function faceOp(msg,fn){
  if(!S.baseSrc||aiBusy)return; aiBusy=true; aiOverlay(true,"กำลังตรวจใบหน้า…");
  try{
    let faces; try{ faces=await detectFaces(); }catch(e){ throw new Error("โหลดโมเดลไม่ได้ — ต้องเปิดบนเว็บจริง (ลิงก์ Pages)"); }
    if(!faces.length) throw new Error("ไม่พบใบหน้าในรูปนี้");
    aiOverlay(true,msg); await new Promise(r=>setTimeout(r,20));
    const W=S.natW,H=S.natH; const work=document.createElement("canvas");work.width=W;work.height=H;work.getContext("2d").drawImage(img,0,0);
    faces.forEach(f=>fn(f,work,W,H)); await bakeCanvas(work); aiToast("เสร็จ ✓");
  }catch(e){ aiToast(e.message||String(e)); } finally{ aiBusy=false; aiOverlay(false); }
}
function warpBulge(cv,cx,cy,r,strength){
  const ctx=cv.getContext("2d");
  const x0=Math.max(0,Math.floor(cx-r)),y0=Math.max(0,Math.floor(cy-r)),x1=Math.min(cv.width,Math.ceil(cx+r)),y1=Math.min(cv.height,Math.ceil(cy+r));
  const w=x1-x0,h=y1-y0; if(w<=0||h<=0)return;
  const src=ctx.getImageData(x0,y0,w,h),sd=src.data,out=ctx.createImageData(w,h),od=out.data;od.set(sd);
  for(let yy=0;yy<h;yy++)for(let xx=0;xx<w;xx++){
    const px=x0+xx,py=y0+yy,dd=Math.hypot(px-cx,py-cy); if(dd>r)continue;
    const k=(1-dd/r)*(1-dd/r)*strength; let sx=cx+(px-cx)*(1-k)-x0,sy=cy+(py-cy)*(1-k)-y0;
    sx=Math.max(0,Math.min(w-1,sx));sy=Math.max(0,Math.min(h-1,sy));
    const xi=Math.floor(sx),yi=Math.floor(sy),fx=sx-xi,fy=sy-yi,xi2=Math.min(w-1,xi+1),yi2=Math.min(h-1,yi+1);
    const i00=(yi*w+xi)*4,i10=(yi*w+xi2)*4,i01=(yi2*w+xi)*4,i11=(yi2*w+xi2)*4,o=(yy*w+xx)*4;
    for(let c=0;c<4;c++){const top=sd[i00+c]*(1-fx)+sd[i10+c]*fx,bot=sd[i01+c]*(1-fx)+sd[i11+c]*fx;od[o+c]=top*(1-fy)+bot*fy;}
  }
  ctx.putImageData(out,x0,y0);
}
function fxTeeth(f,work,W,H){
  const mask=_mask(f,[INNER_LIPS],W,H,Math.min(W,H)*0.004);
  const t=document.createElement("canvas");t.width=W;t.height=H;const tc=t.getContext("2d");
  tc.filter="brightness(1.22) saturate(0.55)";tc.drawImage(work,0,0);tc.filter="none";
  tc.globalCompositeOperation="destination-in";tc.drawImage(mask,0,0);
  work.getContext("2d").drawImage(t,0,0);
}
function fxEyes(f,work,W,H,amt){
  const lc=_center(f,L_EYE,W,H),rc=_center(f,R_EYE,W,H);
  warpBulge(work,lc.x,lc.y,Math.max(8,_span(f,133,33,W)*1.6),amt);
  warpBulge(work,rc.x,rc.y,Math.max(8,_span(f,263,362,W)*1.6),amt);
}
function fxNose(f,work,W,H,amt){
  const cx=f[1].x*W, faceW=_span(f,454,234,W);
  NOSE_SIDES.forEach(i=>{const px=f[i].x*W,py=f[i].y*H,dir=px<cx?1:-1,dx=dir*faceW*0.03*amt;warpPush(work,px,py,faceW*0.08,dx,0,0.8);});
}
function fxLip(f,work,W,H,color){
  const mn=Math.min(W,H);
  const mask=_mask(f,[LIPS],W,H,mn*0.003);
  const mctx=mask.getContext("2d");mctx.globalCompositeOperation="destination-out";mctx.drawImage(_mask(f,[INNER_LIPS],W,H,0),0,0);mctx.globalCompositeOperation="source-over";
  const t=document.createElement("canvas");t.width=W;t.height=H;const tc=t.getContext("2d");
  tc.fillStyle=color;tc.fillRect(0,0,W,H);tc.globalCompositeOperation="destination-in";tc.drawImage(mask,0,0);
  const wc=work.getContext("2d");wc.save();wc.globalCompositeOperation="soft-light";wc.globalAlpha=0.6;wc.drawImage(t,0,0);wc.restore();
}
function fxBlush(f,work,W,H){
  const wc=work.getContext("2d"),faceW=_span(f,454,234,W);
  [_pt(f,50,W,H),_pt(f,280,W,H)].forEach(c=>{const g=wc.createRadialGradient(c.x,c.y,0,c.x,c.y,faceW*0.2);g.addColorStop(0,"rgba(255,120,150,0.5)");g.addColorStop(1,"rgba(255,120,150,0)");wc.save();wc.globalCompositeOperation="soft-light";wc.fillStyle=g;wc.fillRect(0,0,W,H);wc.restore();});
}
function fxAcne(f,work,W,H){
  const mn=Math.min(W,H);
  const mask=_mask(f,[FACE_OVAL],W,H,mn*0.012);
  const mctx=mask.getContext("2d");mctx.globalCompositeOperation="destination-out";[L_EYE,R_EYE,LIPS,L_BROW,R_BROW].forEach(idx=>mctx.drawImage(_mask(f,[idx],W,H,0),0,0));mctx.globalCompositeOperation="source-over";
  const blur=document.createElement("canvas");blur.width=W;blur.height=H;const bc=blur.getContext("2d");
  bc.filter=`blur(${Math.max(2,mn*0.01)}px)`;bc.drawImage(work,0,0);bc.filter="none";bc.globalCompositeOperation="destination-in";bc.drawImage(mask,0,0);
  const wc=work.getContext("2d");wc.save();wc.globalAlpha=0.9;wc.drawImage(blur,0,0);wc.restore();
}

/* ========== LIVE BEAUTY CAMERA ========== */
let camStream=null, camFacing="user", camBeauty=0.5;
$("#btnCam").onclick=openCamera;
function camFilterStr(scale){ return `blur(${(camBeauty*1.6*(scale||1)).toFixed(2)}px) brightness(${(1+camBeauty*0.12).toFixed(3)}) saturate(${(1+camBeauty*0.12).toFixed(3)}) contrast(1.02)`; }
async function openCamera(){
  const m=$("#camModal")||(()=>{const d=document.createElement("div");d.id="camModal";d.className="modal";document.body.appendChild(d);return d;})();
  m.innerHTML=`<div class="card" style="max-width:520px;padding:12px">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px"><h3 style="margin:0">กล้องบิวตี้สด</h3><button class="tbtn" id="camClose" style="margin-left:auto">ปิด</button></div>
    <div style="position:relative;background:#000;border-radius:12px;overflow:hidden;aspect-ratio:3/4"><video id="camVideo" playsinline autoplay muted style="width:100%;height:100%;object-fit:cover;display:block"></video></div>
    <div class="row"><label>บิวตี้สด</label><input type="range" id="camBeautyR" min="0" max="1" step="0.01" value="${camBeauty}"><output>${Math.round(camBeauty*100)}</output></div>
    <div style="display:flex;gap:8px;margin-top:4px">
      <button class="tbtn" id="camFlip" style="flex:1">🔄 สลับกล้อง</button>
      <button class="tbtn primary" id="camShot" style="flex:2">📸 ถ่าย</button>
    </div>
    <p class="note" id="camNote">อนุญาตกล้อง แล้วเล็งหน้า · ปรับบิวตี้สด · กดถ่ายเพื่อไปแต่งต่อ</p>
  </div>`;
  m.hidden=false;
  const v=$("#camVideo");
  const applyF=()=>{ v.style.filter=camFilterStr(1); v.style.transform=camFacing==="user"?"scaleX(-1)":"none"; };
  applyF();
  async function start(){ try{ if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error("อุปกรณ์ไม่รองรับกล้องในเบราว์เซอร์"); if(camStream)camStream.getTracks().forEach(t=>t.stop()); camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:camFacing},audio:false}); v.srcObject=camStream; }catch(e){ $("#camNote").textContent="เปิดกล้องไม่ได้: "+(e.message||e)+" — ต้องเปิดบนเว็บจริง (https) และกดอนุญาตกล้อง"; } }
  await start();
  $("#camBeautyR").oninput=e=>{camBeauty=+e.target.value;e.target.nextElementSibling.textContent=Math.round(camBeauty*100);applyF();};
  $("#camFlip").onclick=()=>{camFacing=camFacing==="user"?"environment":"user";applyF();start();};
  const close=()=>{ if(camStream){camStream.getTracks().forEach(t=>t.stop());camStream=null;} m.hidden=true; };
  $("#camClose").onclick=close; m.onclick=e=>{ if(e.target===m)close(); };
  $("#camShot").onclick=async()=>{
    if(!camStream)return; const vw=v.videoWidth,vh=v.videoHeight; if(!vw){aiToast("กล้องยังไม่พร้อม");return;}
    const c=document.createElement("canvas");c.width=vw;c.height=vh;const cx=c.getContext("2d");
    cx.filter=camFilterStr(vw/(v.clientWidth||vw));
    if(camFacing==="user"){cx.translate(vw,0);cx.scale(-1,1);}
    cx.drawImage(v,0,0,vw,vh);
    const url=c.toDataURL("image/jpeg",0.95); close(); await setNewImage(url,true); aiToast("ถ่ายแล้ว ✓ แต่งต่อได้เลย");
  };
}

function onResize(){ if(!S.baseSrc)return; fitStage(); applyFrameCSS(); render(); repositionAll(); drawCrop(); }
window.addEventListener("resize",onResize);
try{ new ResizeObserver(()=>onResize()).observe(stage); }catch(_){}
(async function init(){
  buildTabs();
  await setNewImage(makeSample(),false);
  emptyHint.style.display="block";
})();
</script>
