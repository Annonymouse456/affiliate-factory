<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>แผนที่ในจอขับขี่</title>
<script>
  // one page, two ways of drawing: "#3d" asks for the tilted map, which needs a different library
  document.write(/3d/.test(location.hash)
    ? '<link rel="stylesheet" href="maplibre-gl.css"><script src="maplibre-gl.js"><\/script>'
    : '<link rel="stylesheet" href="leaflet.css"><script src="leaflet.js"><\/script>');
</script>
<!--
  The map panel of the car display. A light, flat cousin of the 3D map in /map/: the same sources
  (TomTom tiles, traffic, search and routing when a key is present; OSRM and Photon otherwise), drawn
  with picture tiles instead of 3D so a small head unit can keep up. Written for old browsers on purpose.
  The app feeds it the car's position; nothing here asks the browser for location.
-->
<style>
  html, body { height: 100%; margin: 0; overflow: hidden; background: #0b0f17; color: #eef3f7;
    font-family: "Noto Sans Thai", "Roboto", sans-serif; -webkit-user-select: none; user-select: none; }
  #view { position: absolute; left: 0; top: 0; right: 0; bottom: 0; overflow: hidden; }
  #spin { position: absolute; left: 50%; top: 50%; transition: transform .6s linear; -webkit-transition: -webkit-transform .6s linear; }
  #map { width: 100%; height: 100%; background: #0b0f17; }
  .leaflet-container { background: #0b0f17; }
  .car { width: 44px; height: 44px; margin: -22px 0 0 -22px; }
  .car i { display: block; width: 44px; height: 44px; transition: transform .5s linear; -webkit-transition: -webkit-transform .5s linear; }
  .pin { width: 26px; height: 26px; margin: -24px 0 0 -13px; }

  .keys { position: absolute; right: 8px; bottom: 8px; width: 52px; }
  .key { display: block; width: 52px; height: 52px; margin-top: 8px; border-radius: 26px; border: 1px solid rgba(255,255,255,.22);
    background: rgba(12,17,26,.86); color: #eef3f7; font-size: 26px; line-height: 50px; text-align: center; box-sizing: border-box; }
  .key:active { background: rgba(60,75,100,.9); }
  .key svg { width: 26px; height: 26px; margin-top: 12px; }
  #centre { display: none; }

  #turn { position: absolute; left: 8px; top: 8px; right: 68px; display: none; padding: 8px 12px 8px 60px; min-height: 44px;
    border-radius: 14px; background: rgba(12,17,26,.92); border: 1px solid rgba(255,255,255,.2); box-sizing: border-box; }
  #turn svg { position: absolute; left: 10px; top: 8px; width: 42px; height: 42px; fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  #turnFar { font-size: 22px; font-weight: bold; line-height: 24px; }
  #turnText { font-size: 16px; line-height: 20px; color: #c3ccd6; max-height: 40px; overflow: hidden; }

  #trip { position: absolute; left: 8px; bottom: 8px; display: none; padding: 7px 44px 7px 12px; border-radius: 14px;
    background: rgba(12,17,26,.92); border: 1px solid rgba(255,255,255,.2); max-width: 62%; box-sizing: border-box; }
  #tripMain { font-size: 20px; font-weight: bold; line-height: 24px; white-space: nowrap; }
  #tripName { font-size: 14px; line-height: 18px; color: #c3ccd6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #stop { position: absolute; right: 4px; top: 50%; margin-top: -18px; width: 36px; height: 36px; line-height: 36px; text-align: center; font-size: 20px; color: #ff8d8d; }

  #find { position: absolute; left: 8px; top: 8px; right: 68px; display: none; z-index: 2000; }
  #q { width: 100%; height: 50px; box-sizing: border-box; padding: 0 54px 0 14px; border-radius: 14px; border: 2px solid rgba(255,255,255,.35);
    background: rgba(12,17,26,.96); color: #eef3f7; font: inherit; font-size: 20px; outline: none; -webkit-appearance: none; -webkit-user-select: text; user-select: text; }
  #qx { position: absolute; right: 0; top: 0; width: 50px; height: 50px; line-height: 50px; text-align: center; font-size: 22px; color: #c3ccd6; }
  #hits { margin-top: 6px; border-radius: 14px; overflow: hidden; background: rgba(12,17,26,.96); }
  #hits div { padding: 9px 14px; border-bottom: 1px solid rgba(255,255,255,.12); font-size: 18px; line-height: 22px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #hits div small { display: block; font-size: 13px; line-height: 17px; color: #9aa6b4; overflow: hidden; text-overflow: ellipsis; }
  #hits div:active { background: rgba(60,75,100,.9); }
  #say { position: absolute; left: 8px; top: 8px; display: none; padding: 5px 11px; border-radius: 12px; font-size: 15px;
    background: rgba(12,17,26,.88); border: 1px solid rgba(255,255,255,.16); color: #c3ccd6; }
  #credit { position: absolute; right: 66px; bottom: 2px; font-size: 9px; color: rgba(255,255,255,.45); }
</style>
</head>
<body>
<div id="view"><div id="spin"><div id="map"></div></div></div>

<div id="say"></div>
<div id="turn"><span id="turnIcon"></span><div id="turnFar"></div><div id="turnText"></div></div>
<div id="trip"><div id="tripMain"></div><div id="tripName"></div><div id="stop">✕</div></div>

<div id="find"><input id="q" type="text" placeholder="พิมพ์ชื่อสถานที่ที่จะไป" autocomplete="off"><div id="qx">✕</div><div id="hits"></div></div>

<div class="keys">
  <div class="key" id="look"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg></div>
  <div class="key" id="centre"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg></div>
  <div class="key" id="mode"></div>
  <div class="key" id="in">+</div>
  <div class="key" id="out">−</div>
</div>
<div id="credit"></div>

<script>
(function () {
  'use strict';
  var T = 'https://api.tomtom.com';
  var $ = function (id) { return document.getElementById(id); };
  var host = window.Host || { result: function () {}, save: function () {}, fail: function () {}, status: function () {} };      // the app; absent when opened in a plain browser

  var key = '', accent = '#35c8ff';
  var headingUp = true, follow = true, autoZoom = true;
  var here = null, bearing = 0, kmh = 0;
  var route = null, at = 0, along = 0, off = 0, lastReroute = 0, stamp = Date.now();
  var freeTimer = null, sayTimer = null;

  var GL = /3d/.test(location.hash);       // the tilted 3D map, asked for by the app; otherwise flat picture tiles
  var view;                                // whichever one is drawing; the rest of this page speaks to it only through these few functions

  // A bright map by day and a dark one after sunset: roads stand out far better on the bright one, and the dark one does not glare at night.
  function isDay() { var h = new Date().getHours(); return h >= 6 && h < 18; }
  var day = isDay();
  function look3() {
    return day ? { ground: '#e9ecef', way: '#1766ff', edge: '#ffffff', gone: '#8c96a6', building: '#c5ccd8' }
               : { ground: '#0b0f17', way: '#4da6ff', edge: '#06142e', gone: '#5d6878', building: '#3a4a6b' };
  }
  function baseUrl() {
    return key ? T + '/map/1/tile/basic/' + (day ? 'main' : 'night') + '/{z}/{x}/{y}.png?key=' + key + '&language=th-TH'
               : 'https://{s}.basemaps.cartocdn.com/' + (day ? 'rastertiles/voyager' : 'dark_all') + '/{z}/{x}/{y}.png';
  }
  function flowUrl() { return T + '/traffic/map/4/tile/flow/relative0/{z}/{x}/{y}.png?key=' + key + '&t=' + stamp; }
  function credit() { $('credit').textContent = key ? '© TomTom' : '© OpenStreetMap © CARTO'; }
  function arrowSvg() {
    return '<svg viewBox="0 0 44 44" width="44" height="44"><circle cx="22" cy="22" r="21" fill="#0b1220" opacity=".55"/>' +
      '<path d="M22 5l12 30-12-7-12 7z" fill="' + accent + '" stroke="#fff" stroke-width="3" stroke-linejoin="round"/></svg>';
  }
  var PIN = '<svg viewBox="0 0 24 24" width="26" height="26"><path d="M12 23s-7-6.5-7-12a7 7 0 0 1 14 0c0 5.5-7 12-7 12z" fill="#ff4d5e" stroke="#fff" stroke-width="1.6"/><circle cx="12" cy="11" r="2.6" fill="#fff"/></svg>';
  var troubled = false, fails = 0;
  function tileFailed() { if (++fails >= 6 && !troubled) { troubled = true; say('โหลดแผนที่ไม่ได้ ตรวจอินเทอร์เน็ตของจอรถ', 0); } }
  function tileLoaded() { fails = 0; if (troubled) { troubled = false; say('', 0); } }

  // ---------------------------------------------------------------- the flat map: picture tiles, turned as a whole to face the way the car is going

  function flatView() {
    var turned = 0;                        // the map's rotation, kept continuous so it never spins the long way
    var map = L.map('map', { zoomControl: false, attributionControl: false, preferCanvas: true, fadeAnimation: false, zoomSnap: 1,
      inertia: false, doubleClickZoom: false, dragging: false }).setView([13.7563, 100.5018], 12);
    var base = L.tileLayer('', { maxZoom: 19, keepBuffer: 1, updateWhenIdle: true, subdomains: 'abcd' });
    var flow = L.tileLayer('', { maxZoom: 19, opacity: 0.8, zIndex: 5, keepBuffer: 0, updateWhenIdle: true });
    var edge = L.polyline([], { color: look3().edge, weight: 15, opacity: 1, lineCap: 'round', lineJoin: 'round', interactive: false });
    var line = L.polyline([], { color: look3().way, weight: 9, opacity: 1, lineCap: 'round', lineJoin: 'round', interactive: false });
    var done = L.polyline([], { color: look3().gone, weight: 9, opacity: 1, interactive: false });
    var pin = L.marker([0, 0], { interactive: false, icon: L.divIcon({ className: 'pin', iconSize: null, html: PIN }) });
    var car = L.marker([13.7563, 100.5018], { interactive: false, zIndexOffset: 1000, icon: L.divIcon({ className: 'car', iconSize: null, html: '<i id="arrow"></i>' }) });
    base.on('tileerror', tileFailed);
    base.on('tileload', tileLoaded);

    function size() {          // the map is a square as wide as the panel's diagonal, so turning it never shows an empty corner
      var w = window.innerWidth, h = window.innerHeight, s = Math.ceil(Math.sqrt(w * w + h * h)) + 8, spin = $('spin').style;
      if (!headingUp) { spin.width = w + 'px'; spin.height = h + 'px'; spin.marginLeft = -w / 2 + 'px'; spin.marginTop = -h / 2 + 'px'; }
      else { spin.width = s + 'px'; spin.height = s + 'px'; spin.marginLeft = -s / 2 + 'px'; spin.marginTop = -s / 2 + 'px'; }
      map.invalidateSize(false);
    }
    function turn() {
      var want = headingUp && follow ? -bearing : 0, d = ((want - turned) % 360 + 540) % 360 - 180;
      turned += d;
      var t = 'rotate(' + turned.toFixed(1) + 'deg)';
      $('spin').style.webkitTransform = t; $('spin').style.transform = t;
      var a = $('arrow');
      if (a) { var r = 'rotate(' + bearing.toFixed(1) + 'deg)'; a.style.webkitTransform = r; a.style.transform = r; }
    }
    return {
      ready: false,
      centre: function () { var c = map.getCenter(); return [c.lat, c.lng]; },
      zoom: function () { return map.getZoom(); },
      setZoom: function (z) { map.setZoom(z); },
      tiles: function () {
        base.setUrl(baseUrl());
        if (!map.hasLayer(base)) base.addTo(map);
        document.body.style.background = $('map').style.background = look3().ground;
        try { var f = day ? '' : 'brightness(1.5) contrast(1.1)'; base.getContainer().style.webkitFilter = f; base.getContainer().style.filter = f; } catch (e) { }      // lift the night map: as drawn it is too dim to read in a car
        edge.setStyle({ color: look3().edge }); line.setStyle({ color: look3().way }); done.setStyle({ color: look3().gone });
        if (key) { flow.setUrl(flowUrl()); if (!map.hasLayer(flow)) flow.addTo(map); } else if (map.hasLayer(flow)) flow.remove();
        this.ready = true;
      },
      traffic: function () { flow.setUrl(flowUrl()); },
      colour: function () { var a = $('arrow'); if (a) a.innerHTML = arrowSvg(); turn(); },
      route: function (pts) { if (pts) { edge.setLatLngs(pts).addTo(map); line.setLatLngs(pts).addTo(map); } else { edge.remove(); line.remove(); done.remove(); } },
      gone: function (pts) { done.setLatLngs(pts); if (!map.hasLayer(done)) done.addTo(map); },
      pin: function (ll) { if (ll) pin.setLatLng(ll).addTo(map); else pin.remove(); },
      mode: function () { map.dragging[headingUp ? 'disable' : 'enable'](); size(); turn(); },
      resize: size,
      show: function (first, z) {
        if (first) { car.addTo(map); $('arrow').innerHTML = arrowSvg(); }
        car.setLatLng(here);
        if (follow) {
          if (z == null) z = map.getZoom();
          if (first || z !== map.getZoom()) map.setView(here, z, { animate: false });
          else map.panTo(here, { animate: true, duration: 0.5, easeLinearity: 1 });
        }
        turn();
      },
      jump: function (z) { map.setView(here, z, { animate: false }); turn(); },
      onDrag: function (cb) { map.on('dragstart', cb); }
    };
  }

  // ---------------------------------------------------------------- the 3D map: tilted, with buildings standing up, drawn by the graphics chip

  function tiltView() {
    if (!window.maplibregl || !maplibregl.supported()) throw new Error('no WebGL');
    var spin = $('spin').style;
    spin.width = '100%'; spin.height = '100%'; spin.left = '0'; spin.top = '0'; spin.transition = 'none';
    var tilt = 55, buildings = true, routePts = [], donePts = [], carMark = null, pinMark = null, lin = function (t) { return t; };
    function style() {
      var urls = [], sub = key ? [''] : ['a', 'b', 'c', 'd'];
      for (var i = 0; i < sub.length; i++) urls.push(baseUrl().replace('{s}', sub[i]));
      return { version: 8, sources: { base: { type: 'raster', tiles: urls, tileSize: 256, maxzoom: 19 } },
        layers: [{ id: 'bg', type: 'background', paint: { 'background-color': look3().ground } },
          { id: 'base', type: 'raster', source: 'base', paint: day ? {} : { 'raster-brightness-min': 0.12, 'raster-contrast': 0.25, 'raster-saturation': 0.2 } }] };
    }
    var m = new maplibregl.Map({ container: 'map', style: style(), center: [100.5018, 13.7563], zoom: 11, attributionControl: false,
      dragRotate: false, pitchWithRotate: false, fadeDuration: 0, antialias: false, renderWorldCopies: false });
    try { m.touchZoomRotate.disableRotation(); } catch (e) { }
    function geo(pts) {
      var c = [];
      for (var i = 0; i < pts.length; i++) c.push([pts[i][1], pts[i][0]]);
      return { type: 'Feature', properties: {}, geometry: { type: 'LineString', coordinates: c } };
    }
    function flowLayer() {
      if (!key || m.getSource('flow')) return;
      m.addSource('flow', { type: 'raster', tiles: [flowUrl()], tileSize: 256, maxzoom: 19 });
      m.addLayer({ id: 'flow', type: 'raster', source: 'flow', paint: { 'raster-opacity': 0.8 } }, m.getLayer('route-edge') ? 'route-edge' : undefined);
    }
    function buildingLayer() {
      if (!buildings || m.getLayer('buildings')) return;
      if (!m.getSource('osm')) m.addSource('osm', { type: 'vector', url: 'https://tiles.openfreemap.org/planet' });
      m.addLayer({ id: 'buildings', type: 'fill-extrusion', source: 'osm', 'source-layer': 'building', minzoom: 14.5,
        paint: { 'fill-extrusion-color': look3().building, 'fill-extrusion-height': ['coalesce', ['get', 'render_height'], 9],
          'fill-extrusion-base': ['coalesce', ['get', 'render_min_height'], 0], 'fill-extrusion-opacity': 0.85 } });
    }
    function dress() {                     // everything laid over the base picture; put back each time the base changes
      try {
        flowLayer();
        if (!m.getSource('route')) {
          m.addSource('route', { type: 'geojson', data: geo(routePts) });
          m.addLayer({ id: 'route-edge', type: 'line', source: 'route', layout: { 'line-cap': 'round', 'line-join': 'round' }, paint: { 'line-color': look3().edge, 'line-width': 16 } });
          m.addLayer({ id: 'route', type: 'line', source: 'route', layout: { 'line-cap': 'round', 'line-join': 'round' }, paint: { 'line-color': look3().way, 'line-width': 10 } });
          m.addSource('done', { type: 'geojson', data: geo(donePts) });
          m.addLayer({ id: 'done', type: 'line', source: 'done', layout: { 'line-cap': 'round', 'line-join': 'round' }, paint: { 'line-color': look3().gone, 'line-width': 10 } });
        }
        buildingLayer();
      } catch (e) { }
    }
    m.on('style.load', dress);
    m.on('error', function (e) { if (e && e.sourceId === 'base') tileFailed(); });
    m.on('data', function (e) { if (e && e.sourceId === 'base' && e.tile) tileLoaded(); });
    m.on('move', function () { if (follow && carMark && here) carMark.setLngLat(m.getCenter()); });      // while following, the car is the middle of the picture: keep it glued there between fixes

    function camera(z, quick) {
      var o = { center: [here[1], here[0]], bearing: headingUp ? bearing : 0, pitch: headingUp ? tilt : 0,
        padding: { top: headingUp ? Math.round(window.innerHeight * 0.3) : 0, bottom: 0, left: 0, right: 0 } };
      if (z != null) o.zoom = z - 1;       // this map counts zoom one lower than picture-tile maps for the same scale
      if (quick) m.jumpTo(o); else { o.duration = 950; o.easing = lin; m.easeTo(o); }
    }

    // How smoothly is it drawing? Time the gaps between frames while the map moves; when it clearly struggles, give up the costliest parts in turn.
    var gaps = [], lastFrame = 0, slow = 0, told = 0;
    m.on('render', function () {
      var now = Date.now();
      if (lastFrame && now - lastFrame < 500) gaps.push(now - lastFrame);
      lastFrame = now;
      if (gaps.length < 50) return;
      var sum = 0;
      for (var i = 0; i < gaps.length; i++) sum += gaps[i];
      var fps = Math.round(1000 / (sum / gaps.length));
      gaps = [];
      if (now - told > 30000) { told = now; host.status('fps ' + fps); }
      slow = fps < 10 ? slow + 1 : 0;
      if (slow < 3) return;
      slow = 0;
      if (buildings) { buildings = false; try { m.removeLayer('buildings'); } catch (e) { } host.status('eased buildings off at fps ' + fps); }
      else if (tilt > 35) { tilt = 35; host.status('eased tilt to 35 at fps ' + fps); }
    });

    return {
      ready: false,
      centre: function () { var c = m.getCenter(); return [c.lat, c.lng]; },
      zoom: function () { return Math.round(m.getZoom()) + 1; },
      setZoom: function (z) { m.easeTo({ zoom: z - 1, duration: 300 }); },
      tiles: function () { m.setStyle(style(), { diff: false }); this.ready = true; },
      traffic: function () { try { if (m.getLayer('flow')) m.removeLayer('flow'); if (m.getSource('flow')) m.removeSource('flow'); flowLayer(); } catch (e) { } },
      colour: function () {
        if (carMark) carMark.getElement().innerHTML = arrowSvg();
      },
      route: function (pts) { routePts = pts || []; if (!pts) donePts = []; try { m.getSource('route').setData(geo(routePts)); if (!pts) m.getSource('done').setData(geo([])); } catch (e) { } },
      gone: function (pts) { donePts = pts; try { m.getSource('done').setData(geo(pts)); } catch (e) { } },
      pin: function (ll) {
        if (pinMark) { pinMark.remove(); pinMark = null; }
        if (!ll) return;
        var el = document.createElement('div');
        el.innerHTML = PIN;
        pinMark = new maplibregl.Marker({ element: el, anchor: 'bottom' }).setLngLat([ll[1], ll[0]]).addTo(m);
      },
      mode: function () { m.resize(); if (here && follow) camera(null, true); },
      resize: function () { m.resize(); },
      show: function (first, z) {
        if (!carMark) {
          var el = document.createElement('div');
          el.style.width = '44px'; el.style.height = '44px';
          el.innerHTML = arrowSvg();
          carMark = new maplibregl.Marker({ element: el, rotationAlignment: 'map', pitchAlignment: 'map' }).setLngLat([here[1], here[0]]).addTo(m);
        }
        carMark.setRotation(bearing);
        if (follow) camera(z, first); else carMark.setLngLat([here[1], here[0]]);
      },
      jump: function (z) { camera(z, true); if (carMark) carMark.setLngLat([here[1], here[0]]); },
      onDrag: function (cb) { m.on('dragstart', function (e) { if (e && e.originalEvent) cb(); }); }
    };
  }

  // ---------------------------------------------------------------- shared between the two

  setInterval(function () {
    if (isDay() === day || !view.ready) return;
    day = isDay();
    view.tiles(); credit();
  }, 60000);

  setInterval(function () {            // fresh traffic every two minutes
    if (!key || document.hidden || !view.ready) return;
    stamp = Date.now();
    view.traffic();
  }, 120000);

  function say(text, seconds) {
    clearTimeout(sayTimer);
    $('say').textContent = text;
    $('say').style.display = text && !route ? 'block' : 'none';
    if (text && seconds) sayTimer = setTimeout(function () { $('say').style.display = 'none'; }, seconds * 1000);
  }

  function modeLabel() {
    $('mode').innerHTML = headingUp
      ? '<svg viewBox="0 0 24 24"><path d="M12 3l6 17-6-4-6 4z" fill="currentColor"/></svg>'
      : '<span style="font-size:20px;font-weight:bold">N</span>';
    view.mode();
  }

  function refollow() {
    follow = true; autoZoom = true;
    $('centre').style.display = 'none';
    if (here) view.jump(wantedZoom());
  }

  function wantedZoom() { return kmh < 35 ? 17 : kmh < 75 ? 16 : 15; }

  // ---------------------------------------------------------------- the car's position, from the app

  function fix(lat, lon, dir, speed) {
    var first = !here;
    here = [lat, lon];
    kmh = speed < 0 ? 0 : speed;
    if (dir >= 0 && kmh > 5) bearing = dir;                       // a stopped car's compass reading wanders; keep the last good one
    if (first) say('', 0);
    view.show(first, follow && autoZoom ? wantedZoom() : null);
    if (route) progress();
  }

  // ---------------------------------------------------------------- finding a place and a way there

  function get(url, ok, fail) {
    var x = new XMLHttpRequest();
    x.open('GET', url, true);
    x.timeout = 12000;
    x.onload = function () {
      if (x.status < 200 || x.status >= 300) return fail('http ' + x.status);
      try { ok(JSON.parse(x.responseText)); } catch (e) { fail('bad answer'); }
    };
    x.onerror = function () { fail('no network'); };
    x.ontimeout = function () { fail('timeout'); };
    x.send();
  }

  function metres(a, b) {
    var k = Math.PI / 180, dy = (b[0] - a[0]) * k, dx = (b[1] - a[1]) * k * Math.cos((a[0] + b[0]) / 2 * k);
    return 6371000 * Math.sqrt(dx * dx + dy * dy);
  }

  /** Places matching some words, nearest first where the service allows: TomTom with a key, the free Photon service without. */
  function places(query, most, ok, fail) {
    var near = here || view.centre();
    var photon = function () {
      get('https://photon.komoot.io/api/?limit=' + most + '&q=' + encodeURIComponent(query) + '&lat=' + near[0] + '&lon=' + near[1], function (j) {
        var out = [], fs = j.features || [];
        for (var i = 0; i < fs.length; i++) {
          var p = fs[i].properties || {}, name = p.name || p.street || query, where = [];
          var parts = [p.street, p.district, p.city, p.state];
          for (var k = 0; k < parts.length; k++) if (parts[k] && parts[k] !== name) where.push(parts[k]);
          out.push({ at: [fs[i].geometry.coordinates[1], fs[i].geometry.coordinates[0]], name: name, sub: where.join(', ') });
        }
        if (!out.length) return fail('not found');
        ok(out);
      }, fail);
    };
    if (!key) return photon();
    get(T + '/search/2/search/' + encodeURIComponent(query) + '.json?key=' + key + '&limit=' + most + '&countrySet=TH&language=th-TH&lat=' + near[0] + '&lon=' + near[1], function (j) {
      var out = [], rs = j.results || [];
      for (var i = 0; i < rs.length; i++) {
        var r = rs[i], address = (r.address && r.address.freeformAddress) || '';
        out.push({ at: [r.position.lat, r.position.lon], name: (r.poi && r.poi.name) || address || query, sub: r.poi ? address : '' });
      }
      if (!out.length) return photon();
      ok(out);
    }, photon);
  }
  function find(query, ok, fail) { places(query, 1, function (list) { ok(list[0]); }, fail); }

  var TURN = { left: 'เลี้ยวซ้าย', right: 'เลี้ยวขวา', 'slight left': 'เบี่ยงซ้าย', 'slight right': 'เบี่ยงขวา',
    'sharp left': 'เลี้ยวซ้ายหักศอก', 'sharp right': 'เลี้ยวขวาหักศอก', straight: 'ตรงไป', uturn: 'กลับรถ' };
  var ICONS = { straight: 'M12 21V4M5 11l7-7 7 7', right: 'M6 21v-8a4 4 0 0 1 4-4h9M14 4l5 5-5 5', 'slight-right': 'M8 21v-6l9-9M9 5h8v8',
    uturn: 'M7 21V9a4.5 4.5 0 0 1 9 0v7M11.5 12l4.5 4.5 4.5-4.5', roundabout: 'M12 21v-5M12 16a4 4 0 1 1 4-4M13.5 9.5l2.5 2.5 2.5-2.5',
    arrive: 'M12 21s-6-5.5-6-10a6 6 0 0 1 12 0c0 4.5-6 10-6 10zM12 9.5a1.5 1.5 0 1 0 .01 0' };

  function icon(kind) {
    var flip = kind === 'left' || kind === 'slight-left', k = flip ? kind.replace('left', 'right') : kind;
    return '<svg viewBox="0 0 24 24" stroke="' + accent + '"' + (flip ? ' style="transform:scaleX(-1);-webkit-transform:scaleX(-1)"' : '') + '><path d="' + (ICONS[k] || ICONS.straight) + '"/></svg>';
  }
  function osrmKind(m) {
    if (m.type === 'arrive') return 'arrive';
    if (m.type === 'roundabout' || m.type === 'rotary') return 'roundabout';
    var d = m.modifier || '';
    return d === 'uturn' ? 'uturn' : d.indexOf('slight') >= 0 ? 'slight-' + d.split(' ')[1] : d.indexOf('left') >= 0 ? 'left' : d.indexOf('right') >= 0 ? 'right' : 'straight';
  }
  function tomtomKind(mv) {
    mv = mv || '';
    if (mv.indexOf('ARRIVE') >= 0) return 'arrive';
    if (mv.indexOf('UTURN') >= 0) return 'uturn';
    if (mv.indexOf('ROUNDABOUT') >= 0) return 'roundabout';
    var soft = /KEEP|BEAR|EXIT|MOTORWAY/.test(mv) ? 'slight-' : '';
    return mv.indexOf('LEFT') >= 0 ? soft + 'left' : mv.indexOf('RIGHT') >= 0 ? soft + 'right' : 'straight';
  }
  function osrmText(st) {
    var m = st.maneuver, road = st.name ? ' เข้า ' + st.name : '';
    if (m.type === 'depart') return 'ออกเดินทาง' + (st.name ? ' ตาม ' + st.name : '');
    if (m.type === 'arrive') return 'ถึงจุดหมาย';
    if (m.type === 'roundabout' || m.type === 'rotary') return 'เข้าวงเวียน' + (m.exit ? ' ออกทางออกที่ ' + m.exit : '');
    return (TURN[m.modifier] || 'ตรงไป') + road;
  }

  function ways(from, to, ok, fail) {
    var finish = function (r) {
      r.cum = [0];
      for (var i = 1; i < r.pts.length; i++) r.cum[i] = r.cum[i - 1] + metres(r.pts[i - 1], r.pts[i]);
      ok(r);
    };
    var osrm = function () {
      get('https://router.project-osrm.org/route/v1/driving/' + from[1] + ',' + from[0] + ';' + to[1] + ',' + to[0] + '?overview=full&geometries=geojson&steps=true', function (j) {
        var rt = (j.routes || [])[0];
        if (!rt) return fail('no route');
        var steps = [], acc = 0, l, s;
        for (l = 0; l < rt.legs.length; l++) for (s = 0; s < rt.legs[l].steps.length; s++) {
          var st = rt.legs[l].steps[s];
          steps.push({ text: osrmText(st), at: acc, kind: osrmKind(st.maneuver) });
          acc += st.distance;
        }
        var pts = [], c = rt.geometry.coordinates;
        for (var i = 0; i < c.length; i++) pts.push([c[i][1], c[i][0]]);
        finish({ traffic: false, dist: rt.distance, dur: rt.duration, pts: pts, steps: steps });
      }, fail);
    };
    if (!key) return osrm();
    get(T + '/routing/1/calculateRoute/' + from[0] + ',' + from[1] + ':' + to[0] + ',' + to[1] + '/json?key=' + key + '&traffic=true&travelMode=car&instructionsType=text&language=th-TH', function (j) {
      var rt = (j.routes || [])[0];
      if (!rt) return osrm();
      var pts = [], l, i, ins = (rt.guidance || {}).instructions || [], steps = [];
      for (l = 0; l < rt.legs.length; l++) for (i = 0; i < rt.legs[l].points.length; i++) pts.push([rt.legs[l].points[i].latitude, rt.legs[l].points[i].longitude]);
      for (i = 0; i < ins.length; i++) steps.push({ text: ins[i].message, at: ins[i].routeOffsetInMeters, kind: tomtomKind(ins[i].maneuver) });
      finish({ traffic: true, dist: rt.summary.lengthInMeters, dur: rt.summary.travelTimeInSeconds, pts: pts, steps: steps });
    }, osrm);                       // key refused or quota used up: fall back to the free router
  }

  function far(m) { return m >= 1000 ? (m / 1000).toFixed(m >= 10000 ? 0 : 1) + ' กม.' : Math.max(10, Math.round(m / 10) * 10) + ' ม.'; }
  function lasting(s) { var m = Math.max(1, Math.round(s / 60)); return m >= 60 ? Math.floor(m / 60) + ' ชม. ' + (m % 60) + ' นาที' : m + ' นาที'; }

  function start(r, name, target) {
    route = r; route.name = name; route.to = target;
    at = 0; along = 0; off = 0;
    view.route(r.pts);
    view.gone([]);
    view.pin(target);
    $('say').style.display = 'none';
    $('trip').style.display = 'block';
    $('turn').style.display = 'block';
    $('tripName').textContent = name;
    progress();
  }

  function clear(quiet) {
    route = null;
    view.route(null); view.pin(null);
    $('trip').style.display = 'none';
    $('turn').style.display = 'none';
    if (!quiet) host.save('route', '');
  }

  /** Where the car is along the route: how far is left, and what the next turn is. */
  function progress() {
    if (!route || !here) return;
    // nearest point on the route line itself, not just its corners: a straight motorway has corners kilometres apart
    var k = Math.PI / 180, cos = Math.cos(here[0] * k), best = -1, bestD = 1e9, bestT = 0, to = Math.min(route.pts.length - 2, at + 80);
    for (var i = Math.max(0, at - 3); i <= to; i++) {
      var a = route.pts[i], b = route.pts[i + 1];
      var bx = (b[1] - a[1]) * cos, by = b[0] - a[0], px = (here[1] - a[1]) * cos, py = here[0] - a[0], len = bx * bx + by * by;
      var t = len ? Math.max(0, Math.min(1, (px * bx + py * by) / len)) : 0;
      var d = metres(here, [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t]);
      if (d < bestD) { bestD = d; best = i; bestT = t; }
    }
    if (bestD < 70) { at = best; along = bestT; off = 0; } else if (kmh > 8) off++;
    var gone = route.cum[at] + (route.cum[at + 1] - route.cum[at]) * along || 0, left = route.dist - gone;
    if (off >= 6 && Date.now() - lastReroute > 20000) {            // left the route for a few seconds: plan again from here
      lastReroute = Date.now(); off = 0;
      var name = route.name, target = route.to;
      ways(here, target, function (r) { if (route) start(r, name, target); }, function () { });
      return;
    }
    if (left < 45 && metres(here, route.to) < 80) { clear(false); say('ถึงจุดหมายแล้ว', 10); return; }
    view.gone(route.pts.slice(0, at + 1).concat([here]));
    $('tripMain').textContent = far(left) + '  ·  ' + lasting(route.dur * left / Math.max(1, route.dist));
    var next = null;
    for (var s = 0; s < route.steps.length; s++) if (route.steps[s].at > gone + 8) { next = route.steps[s]; break; }
    if (!next) next = { text: 'ถึงจุดหมาย', at: route.dist, kind: 'arrive' };
    $('turnIcon').innerHTML = icon(next.kind);
    $('turnFar').textContent = 'อีก ' + far(next.at - gone);
    $('turnText').textContent = next.text;
  }

  /** Called by the app when the co-pilot is asked to guide somewhere. Answers through Host.result. */
  function go(query) {
    if (!here) return host.result(JSON.stringify({ ok: false, why: 'no gps' }));
    var exact = /^\s*(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)\s*(?:\|(.*))?$/.exec(query);        // "latitude,longitude" or "latitude,longitude|name": no search needed
    (exact ? function (q, ok) { ok({ at: [parseFloat(exact[1]), parseFloat(exact[2])], name: exact[3] || 'จุดหมายที่เลือก' }); } : find)(query, function (place) {
      ways(here, place.at, function (r) {
        start(r, place.name, place.at);
        host.save('route', query);
        host.result(JSON.stringify({ ok: true, name: place.name, km: Math.round(r.dist / 100) / 10, minutes: Math.round(r.dur / 60), traffic: r.traffic }));
      }, function (why) { host.result(JSON.stringify({ ok: false, why: 'route: ' + why, name: place.name })); });
    }, function (why) { host.result(JSON.stringify({ ok: false, why: 'place: ' + why })); });
  }

  try { view = GL ? tiltView() : flatView(); }
  catch (e) { host.fail(String((e && e.message) || e)); throw e; }          // the app then shows the flat map instead

  // ---------------------------------------------------------------- keys on the map

  $('in').onclick = function () { autoZoom = false; view.setZoom(Math.min(19, view.zoom() + 1)); };
  $('out').onclick = function () { autoZoom = false; view.setZoom(Math.max(4, view.zoom() - 1)); };
  $('centre').onclick = refollow;
  $('stop').onclick = function () { clear(false); };
  // the search box: type a place, pick one of the results, and the way there is drawn
  var typing = null, asked = 0;
  function closeFind() { $('find').style.display = 'none'; $('q').blur(); $('q').value = ''; $('hits').innerHTML = ''; }
  function row(text, sub, tap) {
    var d = document.createElement('div');
    d.appendChild(document.createTextNode(text));
    if (sub) { var sm = document.createElement('small'); sm.appendChild(document.createTextNode(sub)); d.appendChild(sm); }
    if (tap) d.onclick = tap;
    $('hits').appendChild(d);
  }
  function look() {
    var q = $('q').value.replace(/^\s+|\s+$/g, ''), mine = ++asked;
    if (q.length < 2) { $('hits').innerHTML = ''; return; }
    places(q, 5, function (list) {
      if (mine !== asked) return;                      // newer typing has replaced this search
      $('hits').innerHTML = '';
      for (var i = 0; i < list.length; i++) (function (p) {
        row(p.name, (here ? far(metres(here, p.at)) + (p.sub ? ' · ' : '') : '') + p.sub, function () {
          closeFind();
          if (!here) return say('ยังไม่มีสัญญาณ GPS จึงหาเส้นทางไม่ได้', 8);
          say('กำลังหาเส้นทาง…', 0);
          ways(here, p.at, function (r) { start(r, p.name, p.at); refollow(); host.save('route', p.name); },
            function () { say('หาเส้นทางไม่ได้ ตรวจอินเทอร์เน็ตของจอรถ', 8); });
        });
      })(list[i]);
    }, function (why) {
      if (mine !== asked) return;
      $('hits').innerHTML = '';
      row(why === 'not found' ? 'ไม่พบสถานที่ ลองพิมพ์ชื่ออื่นหรือเพิ่มชื่อจังหวัด' : 'ค้นหาไม่ได้ ตรวจอินเทอร์เน็ตของจอรถ', '', null);
    });
  }
  $('look').onclick = function () { $('find').style.display = 'block'; $('q').focus(); };
  $('qx').onclick = closeFind;
  $('q').addEventListener('input', function () { clearTimeout(typing); typing = setTimeout(look, 600); });
  $('q').addEventListener('keydown', function (e) { if (e.keyCode === 13) { clearTimeout(typing); $('q').blur(); look(); } });

  $('mode').onclick = function () {
    headingUp = !headingUp;
    host.save('headingUp', headingUp ? '1' : '0');
    modeLabel(); refollow();
  };
  view.onDrag(function () {                     // looking around by hand: hold still, then return to the car by itself
    follow = false;
    $('centre').style.display = 'block';
    clearTimeout(freeTimer);
    freeTimer = setTimeout(refollow, 20000);
  });
  window.addEventListener('resize', function () { view.resize(); });

  window.car = {
    fix: fix, go: go, clear: function () { clear(false); },
    note: function (text) { say(text, 20); },
    config: function (k, colour, up) {
      var changed = k !== key;
      key = k || '';
      if (colour) accent = colour;
      if (up === 0 || up === 1) headingUp = up === 1;
      if (changed || !view.ready) { stamp = Date.now(); view.tiles(); credit(); }
      modeLabel(); view.colour();
    }
  };

  modeLabel(); view.tiles(); credit();
  say('รอสัญญาณ GPS', 0);
  host.result(JSON.stringify({ ready: true }));
})();
</script>
</body>
</html>
