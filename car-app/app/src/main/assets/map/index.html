<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>แผนที่ในจอขับขี่</title>
<link rel="stylesheet" href="leaflet.css">
<script src="leaflet.js"></script>
<!--
  The map panel of the car display: a flat map drawn with picture tiles, kept light so a small head
  unit can keep up. TomTom tiles, traffic, search and routing when a key is present; CARTO tiles, OSRM
  and Photon otherwise. Written for old browsers on purpose.
  The app feeds it the car's position; nothing here asks the browser for location.
-->
<style>
  html, body { height: 100%; margin: 0; overflow: hidden; background: #0b0f17; color: #eef3f7;
    font-family: "Noto Sans Thai", "Roboto", sans-serif; -webkit-user-select: none; user-select: none; }
  #view { position: absolute; left: 0; top: 0; right: 0; bottom: 0; overflow: hidden; }
  #spin { position: absolute; left: 50%; top: 50%; will-change: transform; transition: transform .6s linear; -webkit-transition: -webkit-transform .6s linear; }
  #map { width: 100%; height: 100%; background: #0b0f17; }
  .leaflet-container { background: #0b0f17; }
  .car { width: 56px; height: 56px; margin: -28px 0 0 -28px; }
  .car i { display: block; width: 56px; height: 56px; transition: transform .5s linear; -webkit-transition: -webkit-transform .5s linear; }
  .pin { width: 34px; height: 34px; margin: -32px 0 0 -17px; }

  /* Looks: bright cards by day, dark ones at night. Sizes are for reading at arm's length while driving. */
  body { --card: #ffffff; --ink: #14181f; --dim: #5b6573; --line: rgba(0,0,0,.12); --band: #1746c9; --good: #0b8043; --shade: 0 2px 8px rgba(0,0,0,.35); }
  body.night { --card: #141c2a; --ink: #f1f4f8; --dim: #9aa6b6; --line: rgba(255,255,255,.14); --band: #1b3fa8; --good: #5ee39a; --shade: 0 2px 8px rgba(0,0,0,.6); }

  .keys { position: absolute; right: 10px; bottom: 10px; width: 58px; }
  body.nav .keys { bottom: 112px; }
  .key { display: block; width: 58px; height: 58px; margin-top: 10px; border-radius: 29px; background: var(--card); color: var(--ink);
    box-shadow: var(--shade); font-size: 30px; line-height: 56px; text-align: center; box-sizing: border-box; }
  .key:active { opacity: .7; }
  .key svg { width: 30px; height: 30px; margin-top: 14px; }
  #centre { display: none; }

  /* the next turn: one solid band across the top */
  #turn { position: absolute; left: 10px; top: 10px; right: 10px; display: none; padding: 10px 16px 12px 92px; min-height: 88px;
    border-radius: 20px; background: var(--band); color: #fff; box-shadow: var(--shade); box-sizing: border-box; }
  #turn svg { position: absolute; left: 16px; top: 12px; width: 64px; height: 64px; fill: none; stroke: #fff; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
  #turnFar { font-size: 38px; font-weight: bold; line-height: 42px; }
  #turnText { font-size: 22px; line-height: 28px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: .95; }

  /* the trip: time left, distance and arrival time on one card across the bottom, with the key that ends guiding */
  #trip { position: absolute; left: 10px; bottom: 10px; right: 10px; display: none; height: 92px; padding: 8px 164px 0 20px;
    border-radius: 20px; background: var(--card); color: var(--ink); box-shadow: var(--shade); box-sizing: border-box; }
  #tripMain { font-size: 32px; font-weight: bold; line-height: 38px; white-space: nowrap; color: var(--good); }
  #tripSub { font-size: 20px; line-height: 24px; white-space: nowrap; color: var(--dim); }
  #tripName { font-size: 16px; line-height: 20px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #voice { position: absolute; right: 90px; top: 14px; width: 64px; height: 64px; border-radius: 32px; background: var(--line); color: var(--ink); text-align: center; }
  #voice svg { width: 34px; height: 34px; margin-top: 15px; }
  #voice.off { color: #d93025; }
  #stop { position: absolute; right: 14px; top: 14px; width: 64px; height: 64px; line-height: 62px; border-radius: 32px; text-align: center; font-size: 30px;
    background: #d93025; color: #fff; }

  #find { position: absolute; left: 10px; top: 10px; right: 10px; display: none; z-index: 2000; }
  #q { width: 100%; height: 60px; box-sizing: border-box; padding: 0 64px 0 18px; border-radius: 18px; border: 2px solid var(--line);
    background: var(--card); color: var(--ink); box-shadow: var(--shade); font: inherit; font-size: 24px; outline: none; -webkit-appearance: none; -webkit-user-select: text; user-select: text; }
  #qx { position: absolute; right: 0; top: 0; width: 60px; height: 60px; line-height: 60px; text-align: center; font-size: 26px; color: var(--dim); }
  #how { display: none; margin-top: 8px; }
  #how span { display: inline-block; margin-right: 8px; padding: 9px 16px; border-radius: 14px; font-size: 18px; background: var(--card); color: var(--dim); border: 2px solid var(--line); box-shadow: var(--shade); }
  #how span.on { color: #fff; border-color: var(--band); background: var(--band); }
  #hits { margin-top: 8px; border-radius: 18px; overflow: hidden; background: var(--card); color: var(--ink); box-shadow: var(--shade); }
  #hits div { padding: 10px 18px; border-bottom: 1px solid var(--line); font-size: 22px; line-height: 28px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #hits div small { display: block; font-size: 16px; line-height: 20px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; }
  #hits div:active { opacity: .7; }
  #say { position: absolute; left: 10px; top: 10px; display: none; padding: 8px 16px; border-radius: 16px; font-size: 19px;
    background: var(--card); color: var(--ink); box-shadow: var(--shade); max-width: 80%; }
  .cam { width: 30px; height: 30px; margin: -15px 0 0 -15px; }
  #lanes { position: absolute; left: 10px; top: 106px; display: none; padding: 5px 6px; border-radius: 14px; background: var(--band); box-shadow: var(--shade); white-space: nowrap; }
  #lanes span { display: inline-block; min-width: 40px; height: 44px; margin: 0 2px; padding: 0 2px; border-radius: 9px; color: rgba(255,255,255,.4); text-align: center; }
  #lanes span.ok { background: #fff; color: var(--band); }
  #lanes svg { width: 30px; height: 30px; margin-top: 7px; }
  #warn { position: absolute; right: 10px; top: 106px; display: none; padding: 8px 14px; border-radius: 14px; background: #d93025; color: #fff; font-size: 20px; font-weight: bold; box-shadow: var(--shade); }
  #opts { position: absolute; left: 10px; top: 10px; right: 10px; bottom: 10px; display: none; z-index: 3000; overflow-y: auto; border-radius: 18px; background: var(--card); color: var(--ink); box-shadow: var(--shade); }
  #opts div { padding: 11px 18px; border-bottom: 1px solid var(--line); font-size: 22px; line-height: 28px; }
  #opts div small { display: block; font-size: 16px; line-height: 20px; color: var(--dim); }
  #opts div:active { opacity: .7; }
  #hits { max-height: 360px; overflow-y: auto; }
  #dimmer { position: absolute; left: 0; top: 0; right: 0; bottom: 0; background: #000; opacity: 0; pointer-events: none; z-index: 5000; }
  #credit { position: absolute; left: 12px; bottom: 1px; font-size: 9px; color: var(--dim); }
  body.nav #credit { display: none; }
</style>
</head>
<body>
<div id="view"><div id="spin"><div id="map"></div></div></div>

<div id="say"></div>
<div id="turn"><span id="turnIcon"></span><div id="turnFar"></div><div id="turnText"></div></div>
<div id="trip"><div id="tripMain"></div><div id="tripSub"></div><div id="tripName"></div><div id="voice"></div><div id="stop">✕</div></div>

<div id="find"><input id="q" type="text" placeholder="พิมพ์ชื่อสถานที่ที่จะไป" autocomplete="off"><div id="qx">✕</div><div id="how"><span id="howStop" class="on">แวะก่อนถึงจุดหมาย</span><span id="howNew">เปลี่ยนจุดหมาย</span></div><div id="hits"></div></div>

<div class="keys">
  <div class="key" id="look"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg></div>
  <div class="key" id="centre"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg></div>
  <div class="key" id="mode"></div>
  <div class="key" id="in">+</div>
  <div class="key" id="out">−</div>
</div>
<div id="lanes"></div>
<div id="warn"></div>
<div id="opts"></div>
<div id="credit"></div>
<div id="dimmer"></div>

<script>
(function () {
  'use strict';
  var T = 'https://api.tomtom.com';
  var $ = function (id) { return document.getElementById(id); };
  var host = window.Host || { result: function () {}, save: function () {}, fail: function () {}, status: function () {} };
  if (!host.speak) host.speak = function () {};
  if (!host.load) host.load = function () { return ''; };      // the app; absent when opened in a plain browser

  var key = '', accent = '#35c8ff';
  var headingUp = true, follow = true, autoZoom = true;
  var here = null, bearing = 0, kmh = 0;
  var route = null, at = 0, along = 0, off = 0, lastReroute = 0, stamp = Date.now();
  var freeTimer = null, sayTimer = null;

  var view;                                // the map itself; the rest of this page speaks to it only through a few functions

  // A bright map by day and a dark one after sunset: roads stand out far better on the bright one, and the dark one does not glare at night.
  var forced = 0;                        // set by the app: 2 means night colours now (the display was dimmed, or the headlights are on)
  function isDay() { if (forced === 2) return false; if (forced === 1) return true; var h = new Date().getHours(); return h >= 6 && h < 18; }
  var day = isDay();
  function look3() {
    return day ? { ground: '#e9ecef', way: '#1766ff', edge: '#ffffff', gone: '#8c96a6' }
               : { ground: '#0b0f17', way: '#5fb0ff', edge: '#ffffff', gone: '#6b7686' };
  }
  function baseUrl() {
    return paid() ? T + '/map/1/tile/basic/' + (day ? 'main' : 'night') + '/{z}/{x}/{y}.png?key=' + key + '&language=th-TH'
               : 'https://{s}.basemaps.cartocdn.com/' + (day ? 'rastertiles/voyager' : 'dark_all') + '/{z}/{x}/{y}.png';
  }
  function flowUrl() { return T + '/traffic/map/4/tile/flow/relative0/{z}/{x}/{y}.png?key=' + key + '&t=' + stamp; }
  function skin() { document.body.className = (day ? 'day' : 'night') + (route ? ' nav' : ''); }
  function credit() { skin(); $('credit').textContent = paid() ? '© TomTom' : '© OpenStreetMap © CARTO'; }
  function arrowSvg() {
    return '<svg viewBox="0 0 44 44" width="56" height="56"><circle cx="22" cy="22" r="21" fill="#0b1220" opacity=".55"/>' +
      '<path d="M22 5l12 30-12-7-12 7z" fill="' + accent + '" stroke="#fff" stroke-width="3" stroke-linejoin="round"/></svg>';
  }
  /** A pin: red for the destination, amber for a stop on the way. */
  function pinSvg(last) {
    return '<svg viewBox="0 0 24 24" width="34" height="34"><path d="M12 23s-7-6.5-7-12a7 7 0 0 1 14 0c0 5.5-7 12-7 12z" fill="' + (last ? '#ff4d5e' : '#ffa51f') + '" stroke="#fff" stroke-width="1.6"/><circle cx="12" cy="11" r="2.6" fill="#fff"/></svg>';
  }
  var CAM = '<svg viewBox="0 0 24 24" width="30" height="30"><circle cx="12" cy="12" r="11" fill="#fff" stroke="#d93025" stroke-width="2.4"/><rect x="6" y="9" width="12" height="8" rx="1.6" fill="#14181f"/><circle cx="12" cy="13" r="2.2" fill="#fff"/><rect x="9.5" y="7" width="5" height="2.4" fill="#14181f"/></svg>';
  var troubled = false, fails = 0;
  var spare = false;                     // true while the free map stands in for TomTom's
  function paid() { return key && !spare; }

  // Map pictures that fail to load are not asked for again by themselves, so a map opened before the
  // internet was connected would stay empty. After any failure, keep testing the line every few
  // seconds; the moment a picture comes through, load the whole map afresh.
  var mending = null;
  function tileFailed() {
    fails++;
    if (fails >= 6 && !troubled) { troubled = true; say('ยังโหลดแผนที่ไม่ได้ กำลังลองใหม่เรื่อย ๆ', 0); }
    if (!mending) mending = setInterval(mend, 8000);
  }
  function probe(url, ok, bad) {
    var img = new Image(), done = false;
    var end = function (good) { if (done) return; done = true; (good ? ok : bad)(); };
    img.onload = function () { end(true); };
    img.onerror = function () { end(false); };
    setTimeout(function () { end(false); }, 6000);
    img.src = url + (url.indexOf('?') < 0 ? '?' : '&') + 'try=' + Date.now();
  }
  function mend() {
    var fresh = function (useSpare) {
      clearInterval(mending); mending = null;
      if (useSpare && !spare) host.status('tomtom tiles failing, free map in use');
      spare = useSpare; fails = 0;
      if (troubled) { troubled = false; say('', 0); }
      stamp = Date.now();
      view.tiles(); credit();
    };
    var free = function () { probe('https://a.basemaps.cartocdn.com/rastertiles/voyager/5/25/14.png', function () { fresh(true); }, function () { }); };      // nothing answers: still offline, try again shortly
    // with a key, the keyed map comes first; if only the free one answers, the key is being refused (a spent daily allowance looks like this)
    if (key) probe(T + '/map/1/tile/basic/main/5/25/14.png?key=' + key, function () { fresh(false); }, free); else free();
  }
  function tileLoaded() { fails = 0; if (troubled) { troubled = false; say('', 0); } }

  // ---------------------------------------------------------------- the flat map: picture tiles, turned as a whole to face the way the car is going

  function flatView() {
    var turned = 0;                        // the map's rotation, kept continuous so it never spins the long way
    var map = L.map('map', { zoomControl: false, attributionControl: false, preferCanvas: true, fadeAnimation: false, zoomAnimation: false, markerZoomAnimation: false, zoomSnap: 1,
      inertia: false, doubleClickZoom: false, dragging: false }).setView([13.7563, 100.5018], 12);
    var base = L.tileLayer('', { maxZoom: 19, keepBuffer: 1, updateWhenIdle: true, subdomains: 'abcd' });
    var flow = L.tileLayer('', { maxZoom: 19, opacity: 0.8, zIndex: 5, keepBuffer: 0, updateWhenIdle: true });
    var edge = L.polyline([], { color: look3().edge, weight: 15, opacity: 1, lineCap: 'round', lineJoin: 'round', interactive: false, smoothFactor: 2 });
    var line = L.polyline([], { color: look3().way, weight: 9, opacity: 1, lineCap: 'round', lineJoin: 'round', interactive: false, smoothFactor: 2 });
    var done = L.polyline([], { color: look3().gone, weight: 9, opacity: 1, interactive: false, smoothFactor: 2 });
    var pinsNow = [], marksNow = [];
    var car = L.marker([13.7563, 100.5018], { interactive: false, zIndexOffset: 1000, icon: L.divIcon({ className: 'car', iconSize: null, html: '<i id="arrow"></i>' }) });
    base.on('tileerror', tileFailed);
    base.on('tileload', function () { tileLoaded(); if (paid()) used('tiles'); });
    flow.on('tileload', function () { if (paid()) used('tiles'); });

    function size() {          // the map is a square as wide as the panel's diagonal, so turning it never shows an empty corner
      var w = window.innerWidth, h = window.innerHeight, s = Math.ceil(Math.sqrt(w * w + h * h)) + 8, spin = $('spin').style;
      if (!headingUp) { spin.width = w + 'px'; spin.height = h + 'px'; spin.marginLeft = -w / 2 + 'px'; spin.marginTop = -h / 2 + 'px'; }
      else { spin.width = s + 'px'; spin.height = s + 'px'; spin.marginLeft = -s / 2 + 'px'; spin.marginTop = -s / 2 + 'px'; }
      map.invalidateSize(false);
    }
    function turn() {
      var want = headingUp && follow ? -bearing : 0, d = ((want - turned) % 360 + 540) % 360 - 180;
      turned += d;
      var t = 'rotate(' + turned.toFixed(1) + 'deg)';
      $('spin').style.webkitTransform = t; $('spin').style.transform = t;
      var a = $('arrow');
      if (a) { var r = 'rotate(' + bearing.toFixed(1) + 'deg)'; a.style.webkitTransform = r; a.style.transform = r; }
    }
    return {
      ready: false,
      centre: function () { var c = map.getCenter(); return [c.lat, c.lng]; },
      zoom: function () { return map.getZoom(); },
      setZoom: function (z) { map.setZoom(z); },
      tiles: function () {
        base.setUrl(baseUrl());
        if (!map.hasLayer(base)) base.addTo(map);
        document.body.style.background = $('map').style.background = look3().ground;
        // (no image filter on the tiles: it has to be re-applied on every frame while the map moves, which this class of hardware cannot afford)
        edge.setStyle({ color: look3().edge }); line.setStyle({ color: look3().way }); done.setStyle({ color: look3().gone });
        if (paid()) { flow.setUrl(flowUrl()); if (!map.hasLayer(flow)) flow.addTo(map); } else if (map.hasLayer(flow)) flow.remove();
        this.ready = true;
      },
      traffic: function () { flow.setUrl(flowUrl()); },
      colour: function () { var a = $('arrow'); if (a) a.innerHTML = arrowSvg(); turn(); },
      route: function (pts) { if (pts) { edge.setLatLngs(pts).addTo(map); line.setLatLngs(pts).addTo(map); } else { edge.remove(); line.remove(); done.remove(); } },
      gone: function (pts) { done.setLatLngs(pts); if (!map.hasLayer(done)) done.addTo(map); },
      pins: function (stops) {
        for (var i = 0; i < pinsNow.length; i++) pinsNow[i].remove();
        pinsNow = [];
        for (i = 0; i < stops.length; i++) pinsNow.push(L.marker(stops[i].at, { interactive: false, icon: L.divIcon({ className: 'pin', iconSize: null, html: pinSvg(i === stops.length - 1) }) }).addTo(map));
      },
      mode: function () { map.dragging[headingUp ? 'disable' : 'enable'](); size(); turn(); },
      resize: size,
      show: function (first, z) {
        if (first) { car.addTo(map); $('arrow').innerHTML = arrowSvg(); }
        car.setLatLng(here);
        if (follow) {
          if (z == null) z = map.getZoom();
          if (first || z !== map.getZoom()) map.setView(here, z, { animate: false });
          else map.panTo(here, { animate: true, duration: 0.5, easeLinearity: 1 });
        }
        turn();
      },
      jump: function (z) { map.setView(here, z, { animate: false }); turn(); },
      marks: function (list) {
        for (var i = 0; i < marksNow.length; i++) marksNow[i].remove();
        marksNow = [];
        for (i = 0; i < list.length; i++) marksNow.push(L.marker(list[i].at, { interactive: false, icon: L.divIcon({ className: 'cam', iconSize: null, html: CAM }) }).addTo(map));
      },
      onDrag: function (cb) { map.on('dragstart', cb); }
    };
  }

  // ---------------------------------------------------------------- around the map

  setInterval(function () {
    if (isDay() === day || !view.ready) return;
    day = isDay();
    spare = false;                       // a new part of the day: give the paid map another try
    view.tiles(); credit();
  }, 60000);

  setInterval(function () {            // fresh traffic every five minutes: each refresh costs map requests from the daily allowance
    if (!paid() || document.hidden || !view.ready) return;
    stamp = Date.now();
    view.traffic();
  }, 300000);

  function say(text, seconds) {
    clearTimeout(sayTimer);
    $('say').textContent = text;
    $('say').style.display = text && !route ? 'block' : 'none';
    if (text && seconds) sayTimer = setTimeout(function () { $('say').style.display = 'none'; }, seconds * 1000);
  }

  function modeLabel() {
    $('mode').innerHTML = headingUp
      ? '<svg viewBox="0 0 24 24"><path d="M12 3l6 17-6-4-6 4z" fill="currentColor"/></svg>'
      : '<span style="font-size:20px;font-weight:bold">N</span>';
    view.mode();
  }

  function refollow() {
    follow = true; autoZoom = true;
    $('centre').style.display = 'none';
    if (here) view.jump(wantedZoom());
  }

  function wantedZoom() { return kmh < 35 ? 17 : kmh < 75 ? 16 : 15; }

  // ---------------------------------------------------------------- the car's position, from the app

  function fix(lat, lon, dir, speed) {
    var first = !here;
    here = [lat, lon];
    kmh = speed < 0 ? 0 : speed;
    if (dir >= 0 && kmh > 5) bearing = dir;                       // a stopped car's compass reading wanders; keep the last good one
    if (first) say('', 0);
    if (first && !route && saved.trip && saved.trip.stops && saved.trip.stops.length && Date.now() - saved.trip.t < 12 * 3600 * 1000) {
      var kept = saved.trip.stops;                     // a trip was under way when the display last closed: carry on with it
      if (metres(here, kept[kept.length - 1].at) < 400) { delete saved.trip; keep(); }      // parked beside the destination: that trip is over
      else setTimeout(function () { if (!route) plan(kept, null, null, 'resume'); }, 1500);
    }
    view.show(first, follow && autoZoom ? wantedZoom() : null);
    if (route) progress();
  }

  // ---------------------------------------------------------------- finding a place and a way there

  function get(url, ok, fail) {
    var x = new XMLHttpRequest();
    x.open('GET', url, true);
    x.timeout = 12000;
    x.onload = function () {
      if (x.status < 200 || x.status >= 300) return fail('http ' + x.status);
      try { ok(JSON.parse(x.responseText)); } catch (e) { fail('bad answer'); }
    };
    x.onerror = function () { fail('no network'); };
    x.ontimeout = function () { fail('timeout'); };
    x.send();
  }

  function metres(a, b) {
    var k = Math.PI / 180, dy = (b[0] - a[0]) * k, dx = (b[1] - a[1]) * k * Math.cos((a[0] + b[0]) / 2 * k);
    return 6371000 * Math.sqrt(dx * dx + dy * dy);
  }

  /** Places matching some words, nearest first where the service allows: TomTom with a key, the free Photon service without. */
  function places(query, most, ok, fail) {
    var near = here || view.centre();
    var photon = function () {
      get('https://photon.komoot.io/api/?limit=' + most + '&q=' + encodeURIComponent(query) + '&lat=' + near[0] + '&lon=' + near[1], function (j) {
        var out = [], fs = j.features || [];
        for (var i = 0; i < fs.length; i++) {
          var p = fs[i].properties || {}, name = p.name || p.street || query, where = [];
          var parts = [p.street, p.district, p.city, p.state];
          for (var k = 0; k < parts.length; k++) if (parts[k] && parts[k] !== name) where.push(parts[k]);
          out.push({ at: [fs[i].geometry.coordinates[1], fs[i].geometry.coordinates[0]], name: name, sub: where.join(', ') });
        }
        if (!out.length) return fail('not found');
        ok(out);
      }, fail);
    };
    if (!key) return photon();
    used('calls');
    get(T + '/search/2/search/' + encodeURIComponent(query) + '.json?key=' + key + '&limit=' + most + '&countrySet=TH&language=th-TH&lat=' + near[0] + '&lon=' + near[1], function (j) {
      var out = [], rs = j.results || [];

    if (left < 40 || metres(here, route.to) < 60) { clear(false); say('ถึงจุดหมายแล้ว', 10); speak('ถึงจุดหมายแล้ว'); return; }
    // a stop is reached when the car comes to the point on the route nearest to it; it then drops off the list and the way carries on
    while (route.stops.length > 1 && route.ends && route.ends.length > 1 && gone > route.ends[0] - 45) { speak('ถึงจุดแวะ ' + route.stops[0].name + ' แล้ว'); route.stops = route.stops.slice(1); route.ends = route.ends.slice(1); view.pins(route.stops); saved.trip = { stops: route.stops, t: Date.now() }; keep(); }
    $('tripName').textContent = route.stops.length > 1
      ? 'แวะ ' + route.stops[0].name + ' อีก ' + far(Math.max(0, (route.ends ? route.ends[0] : 0) - gone)) + (route.stops.length > 2 ? '  (+' + (route.stops.length - 2) + ' จุด)' : '') + '  →  ' + route.name
      : route.name;
    if (at !== goneAt || Date.now() - goneDrawn > 4000) { goneAt = at; goneDrawn = Date.now(); view.gone(route.pts.slice(0, at + 1).concat([here])); }
    var secs = route.dur * left / Math.max(1, route.dist), there = new Date(Date.now() + secs * 1000);
    put('tripMain', lasting(secs));
    put('tripSub', far(left) + '  ·  ถึง ' + ('0' + there.getHours()).slice(-2) + ':' + ('0' + there.getMinutes()).slice(-2));
    var next = null;
    for (var s = 0; s < route.steps.length; s++) if (route.steps[s].at > gone + 8) { next = route.steps[s]; break; }
    if (!next) next = { text: 'ถึงจุดหมาย', at: route.dist, kind: 'arrive' };
    if (next.kind !== iconNow) { iconNow = next.kind; $('turnIcon').innerHTML = icon(next.kind); }
    put('turnFar', far(next.at - gone));
    put('turnText', next.text);
    showLanes(next.lanes, next.at - gone);
    announce(next, next.at - gone);
    watchCameras(gone);
  }

  /** Called by the app when the co-pilot is asked to guide somewhere. Answers through Host.result. */
  /** A place the driver has saved, asked for by what it is called: "บ้าน", "ที่ทำงาน", or a favourite's name. */
  function savedPlace(words) {
    var w = String(words).replace(/^\s+|\s+$/g, '').toLowerCase();
    if (saved.home && /^(กลับ)?บ้าน$|^home$/.test(w)) return saved.home;
    if (saved.work && /^ที่ทำงาน$|^ออฟฟิศ$|^work$|^office$/.test(w)) return saved.work;
    for (var i = 0; i < saved.favs.length; i++) if (saved.favs[i].name.toLowerCase() === w) return saved.favs[i];
    return null;
  }

  function go(query) {
    if (!here) return host.result(JSON.stringify({ ok: false, why: 'no gps' }));
    var asStop = query.charAt(0) === '+';
    if (asStop) query = query.substring(1);
    var exact = /^\s*(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)\s*(?:\|(.*))?$/.exec(query);        // "latitude,longitude" or "latitude,longitude|name": no search needed
    var known = savedPlace(query);
    (known ? function (q, ok) { ok(known); } : exact ? function (q, ok) { ok({ at: [parseFloat(exact[1]), parseFloat(exact[2])], name: exact[3] || 'จุดหมายที่เลือก' }); } : find)(query, function (place) {
      var stops = asStop && route ? [place].concat(route.stops) : [place];
      plan(stops, function (r) {
        host.save('route', query);
        host.result(JSON.stringify({ ok: true, name: place.name, km: Math.round(r.dist / 100) / 10, minutes: Math.round(r.dur / 60), traffic: r.traffic,
          stop: stops.length > 1, then: stops.length > 1 ? stops[stops.length - 1].name : '' }));
      }, function (why) { host.result(JSON.stringify({ ok: false, why: 'route: ' + why, name: place.name })); });
    }, function (why) { host.result(JSON.stringify({ ok: false, why: 'place: ' + why })); });
  }

  try { view = flatView(); }
  catch (e) { host.fail(String((e && e.message) || e)); throw e; }

  // ---------------------------------------------------------------- keys on the map

  $('in').onclick = function () { autoZoom = false; view.setZoom(Math.min(19, view.zoom() + 1)); };
  $('out').onclick = function () { autoZoom = false; view.setZoom(Math.max(4, view.zoom() - 1)); };
  $('centre').onclick = refollow;
  $('stop').onclick = function () { clear(false); };
  $('voice').onclick = function () { voiceOn = !voiceOn; host.save('voice', voiceOn ? '1' : '0'); voiceLabel(); if (voiceOn) host.speak('เปิดเสียงนำทาง'); };
  voiceLabel();
  // the search box: type a place, pick one of the results, and the way there is drawn
  var typing = null, asked = 0;
  function closeFind() { $('find').style.display = 'none'; $('q').blur(); $('q').value = ''; $('hits').innerHTML = ''; }
  function row(text, sub, tap, into) {
    var d = document.createElement('div');
    d.appendChild(document.createTextNode(text));
    if (sub) { var sm = document.createElement('small'); sm.appendChild(document.createTextNode(sub)); d.appendChild(sm); }
    if (tap) d.onclick = tap;
    (into || $('hits')).appendChild(d);
  }
  /** Guide to a chosen place: as a stop on the present trip, or as the destination. */
  function choose(p) {
    closeFind();
    if (!here) return say('ยังไม่มีสัญญาณ GPS จึงหาเส้นทางไม่ได้', 8);
    say('กำลังหาเส้นทาง…', 0);
    var place = { at: p.at, name: p.name };
    plan(route && addStop ? [place].concat(route.stops) : [place], function () { refollow(); },
      function () { say('หาเส้นทางไม่ได้ ตรวจอินเทอร์เน็ตของจอรถ', 8); });
  }
  function awayFrom(p) { return here ? far(metres(here, p.at)) : ''; }
  /** Before anything is typed: home, work, favourites and the last few places. */
  function showHome() {
    $('hits').innerHTML = '';
    var none = 'ยังไม่ได้ตั้ง: นำทางไปที่นั่นสักครั้ง แล้วแตะแถบเวลาด้านล่างเพื่อบันทึก';
    row('บ้าน', saved.home ? saved.home.name + '  ·  ' + awayFrom(saved.home) : none, saved.home ? function () { choose(saved.home); } : null);
    row('ที่ทำงาน', saved.work ? saved.work.name + '  ·  ' + awayFrom(saved.work) : none, saved.work ? function () { choose(saved.work); } : null);
    var i;
    for (i = 0; i < saved.favs.length; i++) (function (p) { row('★ ' + p.name, awayFrom(p), function () { choose(p); }); })(saved.favs[i]);
    for (i = 0; i < saved.recents.length && i < 5; i++) (function (p) { row(p.name, 'เคยไป  ·  ' + awayFrom(p), function () { choose(p); }); })(saved.recents[i]);
    row('ตัวเลือกเส้นทาง', 'เลี่ยงค่าผ่านทาง · เส้นทางอื่น · การใช้โควตาวันนี้', function () { closeFind(); openOpts(); });
  }
  function look() {
    var q = $('q').value.replace(/^\s+|\s+$/g, ''), mine = ++asked;
    if (q.length < 2) { showHome(); return; }
    places(q, 5, function (list) {
      if (mine !== asked) return;                      // newer typing has replaced this search
      $('hits').innerHTML = '';
      for (var i = 0; i < list.length; i++) (function (p) {
        row(p.name, (here ? far(metres(here, p.at)) + (p.sub ? ' · ' : '') : '') + p.sub, function () { choose(p); });
      })(list[i]);
    }, function (why) {
      if (mine !== asked) return;
      $('hits').innerHTML = '';
      row(why === 'not found' ? 'ไม่พบสถานที่ ลองพิมพ์ชื่ออื่นหรือเพิ่มชื่อจังหวัด' : 'ค้นหาไม่ได้ ตรวจอินเทอร์เน็ตของจอรถ', '', null);
    });
  }
  var addStop = true;              // with a route already running, a found place is a stop on the way unless the driver says otherwise
  function howLabel() { $('howStop').className = addStop ? 'on' : ''; $('howNew').className = addStop ? '' : 'on'; }
  $('howStop').onclick = function () { addStop = true; howLabel(); };
  $('howNew').onclick = function () { addStop = false; howLabel(); };
  $('look').onclick = function () { addStop = true; howLabel(); $('how').style.display = route ? 'block' : 'none'; $('find').style.display = 'block'; showHome(); };

  // ---------------------------------------------------------------- the trip's options: other ways, toll roads, stops, saving the place

  function closeOpts() { $('opts').style.display = 'none'; }
  function openOpts() {
    var box = $('opts'), i;
    box.innerHTML = '';
    var add = function (text, sub, tap) { row(text, sub, tap ? function () { closeOpts(); tap(); } : null, box); };
    if (route && route.all && route.all.length > 1 && route.stops.length === 1) {
      for (i = 0; i < route.all.length; i++) (function (r, n) {
        add((r === route ? '● ' : '○ ') + lasting(r.dur) + '  ·  ' + far(r.dist), (n === 0 ? 'เร็วที่สุด' : 'ทางเลือก ' + n) + (r.toll ? '  ·  มีค่าผ่านทาง' : '  ·  ไม่มีค่าผ่านทาง') + (r === route ? '  ·  กำลังใช้' : ''),
          r === route ? null : function () { start(r, route.stops, 'pick', route.all); });
      })(route.all[i], i);
    }
    add('เลี่ยงทางด่วนและค่าผ่านทาง:  ' + (saved.noToll ? 'เปิด' : 'ปิด'), 'แตะเพื่อเปลี่ยน' + (route ? ' แล้วหาเส้นทางใหม่' : ''), function () {
      saved.noToll = !saved.noToll; keep();
      if (route && here) plan(route.stops, null, null, 'again');
    });
    if (route && route.stops.length > 1) add('ข้ามจุดแวะ: ' + route.stops[0].name, 'ไปจุดถัดไปเลย', function () { plan(route.stops.slice(1), null, null, 'again'); });
    if (route) {
      var dest = { at: route.to, name: route.name };
      add('บันทึกจุดหมายนี้เป็น บ้าน', saved.home ? 'ตอนนี้: ' + saved.home.name : '', function () { saved.home = dest; keep(); say('บันทึกเป็นบ้านแล้ว', 4); });
      add('บันทึกจุดหมายนี้เป็น ที่ทำงาน', saved.work ? 'ตอนนี้: ' + saved.work.name : '', function () { saved.work = dest; keep(); say('บันทึกเป็นที่ทำงานแล้ว', 4); });
      var isFav = false;
      for (i = 0; i < saved.favs.length; i++) if (saved.favs[i].name === dest.name) isFav = true;
      add(isFav ? 'เอาออกจากรายการโปรด' : 'เพิ่มในรายการโปรด', dest.name, function () {
        var list = [];
        for (var k = 0; k < saved.favs.length; k++) if (saved.favs[k].name !== dest.name) list.push(saved.favs[k]);
        if (!isFav) list.unshift(dest);
        saved.favs = list.slice(0, 8); keep();
      });
    }
    var u = used();
    add(key ? 'TomTom วันนี้: ภาพแผนที่ประมาณ ' + u.tiles + '  ·  ค้นหาและเส้นทาง ' + u.calls + ' ครั้ง' : 'ยังไม่ได้ใส่คีย์ TomTom',
      key ? 'โควตาฟรีต่อวันอยู่ราว 50,000 ภาพ และ 2,500 ครั้ง (ตัวเลขของ TomTom อาจเปลี่ยน ตรวจที่เว็บของเขา)' : 'ไม่มีจราจร และค้นหาชื่อไทยได้น้อยลง', null);
    add('ปิด', '', function () { });
    box.style.display = 'block';
  }
  $('tripMain').onclick = $('tripSub').onclick = $('tripName').onclick = openOpts;
  $('qx').onclick = closeFind;
  $('q').addEventListener('input', function () { clearTimeout(typing); typing = setTimeout(look, 600); });
  $('q').addEventListener('keydown', function (e) { if (e.keyCode === 13) { clearTimeout(typing); $('q').blur(); look(); } });

  $('mode').onclick = function () {
    headingUp = !headingUp;
    host.save('headingUp', headingUp ? '1' : '0');
    modeLabel(); refollow();
  };
  view.onDrag(function () {                     // looking around by hand: hold still, then return to the car by itself
    follow = false;
    $('centre').style.display = 'block';
    clearTimeout(freeTimer);
    freeTimer = setTimeout(refollow, 20000);
  });
  window.addEventListener('resize', function () { view.resize(); });

  window.car = {
    fix: fix, go: go, clear: function () { clear(false); },
    note: function (text) { say(text, 20); },
    config: function (k, colour, up, look, shade, voice) {
      if (voice === 0 || voice === 1) { voiceOn = voice === 1; voiceLabel(); }
      var changed = k !== key;
      key = k || '';
      if (colour) accent = colour;
      if (up === 0 || up === 1) headingUp = up === 1;
      if (look === 0 || look === 1 || look === 2) forced = look;
      if (shade >= 0) $('dimmer').style.opacity = shade;
      if (isDay() !== day) { day = isDay(); changed = true; }
      if (changed) spare = false;
      if (changed || !view.ready) { stamp = Date.now(); view.tiles(); credit(); }
      modeLabel(); view.colour();
    }
  };

  modeLabel(); view.tiles(); credit();
  say('รอสัญญาณ GPS', 0);
  host.result(JSON.stringify({ ready: true }));
})();
</script>
</body>
</html>
